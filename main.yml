name: Build VILA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find VILA V12 ZIP
        id: find_zip
        shell: bash
        run: |
          set -e
          ZIP="$(find . -maxdepth 3 -type f -name 'VILA_AI_V12_ANDROID_COMPACT_VILA_IMAGE_ICON.zip' -print -quit)"
          if [ -z "$ZIP" ]; then
            echo "ERROR: Khong tim thay VILA V12 ZIP"
            echo "Cac file ZIP hien co:"
            find . -maxdepth 3 -type f -name '*.zip' -print || true
            exit 1
          fi
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Found: $ZIP"

      - name: Extract Android project
        shell: bash
        run: |
          set -e
          rm -rf vila_source
          mkdir -p vila_source
          unzip -q -o "${{ steps.find_zip.outputs.zip }}" -d vila_source
          ROOT="$(find vila_source -type f -name 'settings.gradle*' -print -quit | xargs -r dirname)"
          if [ -z "$ROOT" ]; then
            echo "ERROR: Khong tim thay settings.gradle trong ZIP"
            find vila_source -maxdepth 4 -type f | head -100
            exit 1
          fi
          echo "Android project: $ROOT"
          cp -a "$ROOT"/. .

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VILA-V12-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
