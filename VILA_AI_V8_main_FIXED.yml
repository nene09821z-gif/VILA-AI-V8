name: Build Chess Bot Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'CHESS_BOT_AI_ARENA_v2_6_1_STABILITY_FIX.zip'
      - '.github/workflows/main.yml'

permissions:
  contents: read

concurrency:
  group: chess-bot-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and safely extract Chess Bot source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$GITHUB_WORKSPACE/CHESS_BOT_AI_ARENA_v2_6_1_STABILITY_FIX.zip"
          if [[ ! -f "$ZIP_FILE" ]]; then
            echo "::error::Missing $ZIP_FILE. Upload the Chess Bot source ZIP to the repository root."
            exit 1
          fi
          python3 - <<'PY'
          import os, pathlib, zipfile
          archive = pathlib.Path(os.environ['GITHUB_WORKSPACE']) / 'CHESS_BOT_AI_ARENA_v2_6_1_STABILITY_FIX.zip'
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'chess-bot-source'
          out.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(archive) as zf:
              entries = zf.infolist()
              if len(entries) > 12000:
                  raise SystemExit('ZIP rejected: too many entries')
              if sum(e.file_size for e in entries) > 700 * 1024 * 1024:
                  raise SystemExit('ZIP rejected: expanded size exceeds 700 MB')
              for entry in entries:
                  path = pathlib.PurePosixPath(entry.filename)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'Unsafe ZIP path: {entry.filename}')
              zf.extractall(out)
          candidates = [p for p in out.rglob('package.json') if 'node_modules' not in p.parts]
          if not candidates:
              raise SystemExit('No package.json found in source ZIP')
          # This source archive has package.json at its project root. Fail on ambiguity rather than building the wrong project.
          candidates.sort(key=lambda p: (len(p.parts), str(p)))
          project = candidates[0].parent
          if not (project / 'capacitor.config.json').is_file():
              raise SystemExit(f'Found package.json but not a Capacitor project: {project}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'project_dir={project}\n')
          print(f'Using project: {project}')
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Node dependencies
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: npm install --no-audit --no-fund

      - name: Check source syntax
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: |
          set -euo pipefail
          node --check src/main.js
          node --check server/index.js
          node --check scripts/copy-engine.mjs
          node --check scripts/apply-android-branding.mjs
          node --check scripts/verify-android-project.mjs
          python3 -m py_compile scripts/package-android-source.py

      - name: Run tests
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: npm test

      - name: Build web assets
        working-directory: ${{ steps.source.outputs.project_dir }}
        env:
          REQUIRE_STOCKFISH: '1'
        run: npm run build

      - name: Generate and sync Android project
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f android/settings.gradle && ! -f android/settings.gradle.kts ]]; then
            npx cap add android
          fi
          npx cap sync android
          node scripts/apply-android-branding.mjs
          node scripts/verify-android-project.mjs

      - name: Build debug APK
        working-directory: ${{ steps.source.outputs.project_dir }}/android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK exists
        id: apk
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if [[ ! -s "$APK" ]]; then
            echo "::error::Gradle completed but APK was not found at $APK"
            find android/app/build/outputs -maxdepth 5 -type f -print 2>/dev/null || true
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK" "$GITHUB_WORKSPACE/output/Chess-Bot-debug.apk"
          sha256sum "$GITHUB_WORKSPACE/output/Chess-Bot-debug.apk" | tee "$GITHUB_WORKSPACE/output/SHA256SUMS.txt"
          ls -lh "$GITHUB_WORKSPACE/output"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chess-Bot-debug-APK
          path: output/*
          if-no-files-found: error
          retention-days: 14
