name: Build VILA APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cài đặt Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Chấp nhận giấy phép SDK
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          # Tự động tìm thư mục chứa settings.gradle (nếu dự án nằm trong thư mục con)
          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "Đang tìm settings.gradle..."
            DIR=$(find . -maxdepth 3 \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1 | xargs dirname)
            if [ -n "$DIR" ]; then
              cd "$DIR"
            fi
          fi
          
          # Tự động tạo gradlew nếu thiếu
          if [ ! -f "./gradlew" ]; then
            echo "Không tìm thấy gradlew, đang tự tạo..."
            gradle wrapper
          fi
          
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Tải lên APK
        uses: actions/upload-artifact@v4
        with:
          name: VILA-APK
          path: '**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
