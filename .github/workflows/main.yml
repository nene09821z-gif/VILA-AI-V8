name: VILA AI - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "35"
  BUILD_TOOLS: "35.0.0"

jobs:
  build:
    name: Build VILA AI APK
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Find or extract project
        shell: bash
        run: |
          set -e

          PROJECT=""

          SETTINGS=$(find . \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            ! -path "./.git/*" \
            | head -n 1 || true)

          if [ -n "$SETTINGS" ]; then
            PROJECT=$(dirname "$SETTINGS")
          fi

          if [ -z "$PROJECT" ]; then

            ZIP=$(find . \
              -type f \
              -iname "*.zip" \
              ! -path "./.git/*" \
              | head -n 1 || true)

            if [ -z "$ZIP" ]; then
              echo "Khong tim thay Android project hoac ZIP."
              exit 1
            fi

            echo "ZIP: $ZIP"

            rm -rf .vila_extract
            mkdir -p .vila_extract

            unzip -o "$ZIP" -d .vila_extract

            SETTINGS=$(find .vila_extract \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              | head -n 1 || true)

            if [ -z "$SETTINGS" ]; then
              echo "ZIP khong chua Android project."
              exit 1
            fi

            PROJECT=$(dirname "$SETTINGS")
          fi

          PROJECT=$(realpath "$PROJECT")

          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT"

          ls -la "$PROJECT"

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          if [ -n "${ANDROID_HOME:-}" ]; then
            SDK="$ANDROID_HOME"
          else
            SDK="$ANDROID_SDK_ROOT"
          fi

          echo "SDK=$SDK"

          SDKMANAGER=$(find "$SDK" \
            -type f \
            -name sdkmanager \
            -perm -111 \
            2>/dev/null \
            | head -n 1 || true)

          if [ -z "$SDKMANAGER" ]; then
            echo "Khong tim thay sdkmanager."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          SDKMANAGER_DIR=$(dirname "$SDKMANAGER")

          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          echo "sdkmanager version:"
          "$SDKMANAGER" --version

      - name: Accept Android licenses
        shell: bash
        run: |
          set +e

          mkdir -p "$ANDROID_HOME/licenses"

          cat > "$ANDROID_HOME/licenses/android-sdk-license" <<'EOF'
8933bad161af4178b1185d1a37fbf41ea5269c55
84831b9409646a918e30573bab4c9c91346d8abd
d56f5187479451eabf01fb78af6dfcb131a6481e
24333f8a63b6825ea9c5514f83c2829b004d1fee
EOF

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

      - name: Validate project
        shell: bash
        run: |
          set -e

          cd "$PROJECT"

          if [ ! -f "settings.gradle" ] && \
             [ ! -f "settings.gradle.kts" ]; then
            echo "Thieu settings.gradle."
            exit 1
          fi

          if [ ! -d "app" ]; then
            echo "Thieu thu muc app."
            exit 1
          fi

          echo "Project OK."

      - name: Check VILA server
        shell: bash
        run: |
          if [ -f "$PROJECT/server/server.js" ]; then
            node --check "$PROJECT/server/server.js"
            echo "Server syntax OK."
          else
            echo "Khong co server/server.js."
          fi

      - name: Build APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT"

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Prepare APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT/app/build/outputs/apk" \
            -type f \
            -name "app-debug.apk" \
            | head -n 1 || true)

          if [ -z "$APK" ]; then
            echo "Khong tim thay APK."
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/VILA-AI-V16.apk"

          ls -lh "$GITHUB_WORKSPACE/VILA-AI-V16.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VILA-AI-V16-APK
          path: VILA-AI-V16.apk
          if-no-files-found: error
          retention-days: 30
