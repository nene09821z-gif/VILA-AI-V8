
name: VILA AI - Build APK and ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          accept-android-sdk-licenses: true

      - name: Install Android platform and build tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
            ROOT="."
          elif [ -f VILA_AI_V9_Android/settings.gradle ] || [ -f VILA_AI_V9_Android/settings.gradle.kts ]; then
            ROOT="VILA_AI_V9_Android"
          else
            FILE=$(find . -maxdepth 5 \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -not -path '*/.gradle/*' | head -n 1 || true)

            if [ -z "$FILE" ]; then
              echo "::error::Không tìm thấy settings.gradle của dự án Android."
              exit 1
            fi

            ROOT="$(dirname "$FILE")"
          fi

          echo "dir=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Android project: $ROOT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Configure Android SDK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8"
        run: |
          set -euo pipefail
          gradle assembleDebug --no-daemon --stacktrace

          APK=$(find app/build/outputs/apk/debug \
            -maxdepth 1 -type f -name '*.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "::error::Không tìm thấy APK sau khi build."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK" "$GITHUB_WORKSPACE/output/VILA-AI-debug.apk"

      - name: Package source ZIP
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail
          mkdir -p output

          zip -qr output/VILA-AI-source.zip "$PROJECT_DIR" \
            -x '*/.git/*' \
               '*/.gradle/*' \
               '*/build/*' \
               '*/local.properties' \
               '*/.idea/*' \
               '*/output/*' \
               '*.apk' \
               '*.aab'

      - name: Create complete ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/VILA-AI-package

          cp output/VILA-AI-debug.apk output/VILA-AI-package/
          cp output/VILA-AI-source.zip output/VILA-AI-package/

          cat > output/VILA-AI-package/README.txt <<'EOF'
          VILA AI BUILD PACKAGE
          VILA-AI-debug.apk: Android debug APK.
          VILA-AI-source.zip: Android project source code.
          EOF

          cd output
          zip -qr VILA-AI-complete.zip VILA-AI-package

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VILA-AI-Build-Files
          path: |
            output/VILA-AI-debug.apk
            output/VILA-AI-source.zip
            output/VILA-AI-complete.zip
          if-no-files-found: error
          retention-days: 30
          
