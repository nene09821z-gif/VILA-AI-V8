name: Build VILA AI V9 APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract VILA ZIP
        run: |
          ZIP=$(find . -maxdepth 2 -type f -name 'VILA_AI_V9_1_SERVER_SELECTOR.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "Không tìm thấy VILA_AI_V9_1_SERVER_SELECTOR.zip"
            exit 1
          fi

          mkdir -p vila_source
          unzip -q "$ZIP" -d vila_source

          ROOT=$(find vila_source -type f -name 'settings.gradle*' -printf '%h\n' | head -n 1)

          if [ -z "$ROOT" ]; then
            echo "Không tìm thấy Android project"
            exit 1
          fi

          cp -a "$ROOT"/. .

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VILA-AI-V9-APK
          path: app/build/outputs/apk/debug/app-debug.apk
