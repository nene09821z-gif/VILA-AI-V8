name: VILA AI VIP - Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find VILA ZIP
        id: find_zip
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "Không tìm thấy file ZIP VILA!"
            exit 1
          fi

          echo "ZIP=$ZIP" >> "$GITHUB_OUTPUT"
          echo "Found: $ZIP"

      - name: Extract VILA
        run: |
          mkdir -p vila
          unzip -o "${{ steps.find_zip.outputs.ZIP }}" -d vila

      - name: Detect Android project
        id: detect
        shell: bash
        run: |
          DIR=$(find vila -name settings.gradle -o -name settings.gradle.kts | head -n 1)

          if [ -z "$DIR" ]; then
            echo "Không tìm thấy settings.gradle!"
            find vila -maxdepth 4 -type f | head -100
            exit 1
          fi

          ROOT=$(dirname "$DIR")
          echo "ROOT=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Android root: $ROOT"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: tem
