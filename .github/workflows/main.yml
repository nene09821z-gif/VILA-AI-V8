name: VILA Pro V17 - Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Sửa bước này: Thêm cấu hình để tự động chấp nhận license
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '12.0' # Chỉ định phiên bản cmdline-tools ổn định
          packages: 'platforms;android-35,build-tools;34.0.0,platform-tools'
          accept-licenses: 'true'      # Tự động đồng ý license

      # Bước này giờ có thể giữ nguyên hoặc lược bớt vì setup-android đã cài packages rồi
      - name: Install SDK packages (Dự phòng)
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK" ]; then
            echo "::error::ANDROID_SDK_ROOT/ANDROID_HOME chưa được set"
            exit 1
          fi
          SM=$(find "$SDK" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)
          if [ -z "$SM" ]; then
            SM=$(which sdkmanager || true)
          fi
          echo "sdkmanager=$SM"
          # Đảm bảo chấp nhận license một lần nữa cho chắc chắn
          yes | "$SM" --licenses >/dev/null 2>&1 || true
          "$SM" --install "platforms;android-35" "build-tools;34.0.0" "platform-tools" || true

      - name: Write local.properties
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          echo "sdk.dir=$SDK" > local.properties
          cat local.properties

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8"
        run: |
          set -euo pipefail
          gradle help --no-daemon || true
          gradle assembleDebug --no-daemon --stacktrace

      - name: Find and upload APK
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1 || true)
          if [ -z "${APK:-}" ]; then
            echo "::error::Build xong nhưng không có APK"
            find app/build -type f 2>/dev/null | head -n 100 || true
            exit 1
          fi
          echo "Found: $APK"
          ls -lh "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/VILA-Pro-V17-debug.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VILA-Pro-V17-debug
          path: VILA-Pro-V17-debug.apk
          if-no-files-found: error
          retention-days: 30
