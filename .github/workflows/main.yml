name: VILA Pro V17 - Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tự động giải nén file ZIP
        run: |
          set -euo pipefail
          echo "=== Tìm file ZIP trong repo ==="
          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1 || true)
          
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Không tìm thấy file ZIP nào trong repo!"
            ls -la
            exit 1
          fi
          
          echo "Đã tìm thấy: $ZIP_FILE"
          
          # Tạo thư mục riêng để giải nén, tránh xung đột
          mkdir -p extracted
          
          # Giải nén file ZIP vào thư mục extracted
          unzip -o "$ZIP_FILE" -d extracted
          
          echo "=== Nội dung sau khi giải nén ==="
          ls -la extracted/
          find extracted -maxdepth 2 -type d

      - name: Tìm thư mục dự án Android
        id: find_project
        run: |
          set -euo pipefail
          echo "=== Tìm settings.gradle ==="
          
          # Tìm file settings.gradle hoặc settings.gradle.kts
          SETTINGS=$(find extracted -maxdepth 4 \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1 || true)
          
          if [ -z "$SETTINGS" ]; then
            echo "::error::Không tìm thấy settings.gradle sau khi giải nén!"
            echo "=== Cấu trúc thư mục ==="
            find extracted -maxdepth 3 -type d
            find extracted -maxdepth 3 -type f | head -n 50
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$SETTINGS")
          echo "✅ Tìm thấy dự án Android tại: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          
          # In thử nội dung settings.gradle
          cat "$SETTINGS"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK & Accept Licenses
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK" ]; then
            echo "::error::Không tìm thấy ANDROID_HOME"
            exit 1
          fi
          SM=$(find "$SDK" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)
          if [ -z "$SM" ]; then
            SM=$(which sdkmanager || true)
          fi
          echo "sdkmanager=$SM"
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          "$SM" --install "platforms;android-35" "build-tools;34.0.0" "platform-tools" || \
          "$SM" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Write local.properties
        working-directory: ${{ steps.find_project.outputs.dir }}
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          echo "sdk.dir=$SDK" > local.properties
          cat local.properties

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: ${{ steps.find_project.outputs.dir }}
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8"
        run: |
          set -euo pipefail
          echo "=== Đang build tại: $(pwd) ==="
          ls -la
          gradle assembleDebug --no-daemon --stacktrace

      - name: Find and upload APK
        if: success()
        working-directory: ${{ steps.find_project.outputs.dir }}
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1 || true)
          if [ -z "${APK:-}" ]; then
            echo "::error::Build thành công nhưng không tìm thấy APK"
            find app/build -type f 2>/dev/null | head -n 100 || true
            exit 1
          fi
          echo "Found: $APK"
          ls -lh "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/VILA-Pro-V17-debug.apk"

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: VILA-Pro-V17-debug
          path: VILA-Pro-V17-debug.apk
          if-no-files-found: error
          retention-days: 30
