name: Build VILA APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cài đặt Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Chấp nhận giấy phép SDK
        run: yes | sdkmanager --licenses || true

      # 1. BƯỚC QUAN TRỌNG: Giải nén file ZIP
      - name: Giải nén file ZIP dự án
        run: |
          unzip -q VILA_AI_V24_MULTI_API.zip -d project_src
          echo "Đã giải nén xong."
          ls -la project_src

      # 2. Tìm thư mục chứa settings.gradle và build
      - name: Build APK
        run: |
          cd project_src
          
          # Nếu thư mục gốc không có settings.gradle, tìm thư mục con
          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "Đang tìm settings.gradle..."
            DIR=$(find . -maxdepth 3 \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1 | xargs dirname)
            if [ -n "$DIR" ]; then
              echo "Chuyển vào thư mục: $DIR"
              cd "$DIR"
            fi
          fi
          
          echo "Đang build tại thư mục: $(pwd)"
          ls -la
          
          # Cấp quyền và chạy build
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Tải lên APK
        uses: actions/upload-artifact@v4
        with:
          name: VILA-APK
          path: project_src/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
