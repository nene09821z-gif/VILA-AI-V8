name: VILA Pro Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Find and extract ZIP
        run: |
          set -e
          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" | head -1)
          if [ -n "$ZIP" ]; then
            mkdir -p build_src
            unzip -q "$ZIP" -d build_src
            echo "Đã giải nén $ZIP vào build_src"
          else
            echo "Không tìm thấy file ZIP, copy trực tiếp..."
            mkdir -p build_src
            cp -r ./* build_src/ 2>/dev/null || true
          fi
          ls -la build_src

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 1. BỔ SUNG BƯỚC CÀI ĐẶT ANDROID SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 2. Cài đặt Gradle dự phòng
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        working-directory: build_src
        run: |
          # Tìm thư mục chứa settings.gradle nếu nó bị lồng
          if [ ! -f "settings.gradle" ] && [ ! -f "settings.gradle.kts" ]; then
            echo "Đang tìm settings.gradle..."
            DIR=$(find . -maxdepth 3 \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1 | xargs dirname)
            if [ -n "$DIR" ]; then
              echo "Chuyển vào thư mục: $DIR"
              cd "$DIR"
            fi
          fi
          
          echo "Đang ở thư mục: $(pwd)"
          ls -la
          
          if [ -f "./gradlew" ]; then
            echo "Sử dụng Gradle Wrapper của project..."
            chmod +x ./gradlew
            ./gradlew assembleDebug --stacktrace
          else
            echo "Không tìm thấy gradlew, sử dụng Gradle toàn cục..."
            gradle assembleDebug --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VILA-Pro-APK
          path: build_src/**/build/outputs/apk/debug/*.apk
          if-no-files-found: warn # Đổi thành warn để không làm sập toàn bộ workflow nếu APK lỗi
