name: Build VILA AI STUDIO

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - name: Extract ZIP
        run: |
          set -e
          [ -f VILA_AI_V54_FULL_SYSTEM.zip ] && unzip -o -q VILA_AI_V54_FULL_SYSTEM.zip && rm -f VILA_AI_V54_FULL_SYSTEM.zip || true
          shopt -s nullglob
          ENTRIES=(*)
          if [ ${#ENTRIES[@]} -eq 1 ] && [ -d "${ENTRIES[0]}" ]; then
            shopt -s dotglob; mv "${ENTRIES[0]}"/* . ; shopt -u dotglob
            rmdir "${ENTRIES[0]}" 2>/dev/null || true
          fi
          ls -lah

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null 2>&1 || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Locate & build (capture log)
        id: b
        continue-on-error: true
        run: |
          PROJECT=$(dirname "$(find . -name settings.gradle -o -name settings.gradle.kts 2>/dev/null | grep -v '/build/' | head -1)")
          [ -z "$PROJECT" ] && PROJECT="."
          cd "$PROJECT"
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          # Dùng gradlew nếu có, không thì gradle hệ thống
          if [ -f ./gradlew ]; then chmod +x ./gradlew; CMD=./gradlew; else CMD=gradle; fi
          echo "GRADLE_CMD=$CMD" >> $GITHUB_ENV

          mkdir -p "$GITHUB_WORKSPACE/logs"

          # Chạy build, ghi log đầy đủ
          $CMD --no-daemon assembleDebug > "$GITHUB_WORKSPACE/logs/build.log" 2>&1 || true

          # Lọc các dòng quan trọng
          grep -nE "FAILURE:|What went wrong|Where:|> |error:|Caused by:|Could not|A problem occurred" \
            "$GITHUB_WORKSPACE/logs/build.log" | head -100 > "$GITHUB_WORKSPACE/logs/errors.txt" || true

          # In ra để xem trên GitHub
          echo "=================== LỖI CHÍNH ==================="
          cat "$GITHUB_WORKSPACE/logs/errors.txt"
          echo "=================================================="
          echo ""
          echo "=================== 40 dòng cuối ==================="
          tail -40 "$GITHUB_WORKSPACE/logs/build.log"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: logs/
          retention-days: 3

      - name: Fail nếu build lỗi
        if: steps.b.outcome == 'failure'
        run: exit 1
