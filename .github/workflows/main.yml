name: VILA Pro V17 - Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Bước này thay thế hoàn toàn action setup-android gây lỗi
      - name: Setup Android SDK & Accept Licenses
        run: |
          set -euo pipefail
          # Runner Ubuntu đã có sẵn ANDROID_HOME và sdkmanager
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK" ]; then
            echo "::error::Không tìm thấy ANDROID_HOME"
            exit 1
          fi
          
          # Tìm sdkmanager
          SM=$(find "$SDK" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)
          if [ -z "$SM" ]; then
            SM=$(which sdkmanager || true)
          fi
          echo "sdkmanager=$SM"
          
          # Tự động đồng ý TẤT CẢ license (không bao giờ bị treo)
          yes | "$SM" --licenses > /dev/null 2>&1 || true
          
          # Cài đặt các gói cần thiết
          "$SM" --install "platforms;android-35" "build-tools;34.0.0" "platform-tools" || \
          "$SM" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Write local.properties
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          echo "sdk.dir=$SDK" > local.properties
          cat local.properties

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8"
        run: |
          set -euo pipefail
          gradle help --no-daemon || true
          gradle assembleDebug --no-daemon --stacktrace

      - name: Find and upload APK
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1 || true)
          if [ -z "${APK:-}" ]; then
            echo "::error::Build xong nhưng không có APK"
            find app/build -type f 2>/dev/null | head -n 100 || true
            exit 1
          fi
          echo "Found: $APK"
          ls -lh "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/VILA-Pro-V17-debug.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VILA-Pro-V17-debug
          path: VILA-Pro-V17-debug.apk
          if-no-files-found: error
          retention-days: 30
