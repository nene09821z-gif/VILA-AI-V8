name: VILA Pro V17.2 - Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: vila-pro-build-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_DIR: VILA_AI_V9_Android
  GRADLE_VERSION: '8.11.1'
  ANDROID_API: '35'
  BUILD_TOOLS: '35.0.0'

jobs:
  build:
    name: Build VILA Pro 17.2 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-${{ env.ANDROID_API }} build-tools;${{ env.BUILD_TOOLS }}

      - name: Find or extract Android project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "$PROJECT_DIR/settings.gradle" ] || [ -f "$PROJECT_DIR/settings.gradle.kts" ]; then
            echo "Project found: $PROJECT_DIR"
            exit 0
          fi

          ZIP_FILE="$(find . -type f -iname '*.zip' ! -path './.git/*' -print -quit || true)"

          if [ -z "$ZIP_FILE" ]; then
            echo 'ERROR: Android project and ZIP archive were not found.'
            exit 1
          fi

          echo "Using archive: $ZIP_FILE"

          rm -rf .vila_extract
          mkdir -p .vila_extract

          unzip -q -o "$ZIP_FILE" -d .vila_extract

          SETTINGS="$(find .vila_extract -type f -name 'settings.gradle' -print -quit || true)"

          if [ -z "$SETTINGS" ]; then
            SETTINGS="$(find .vila_extract -type f -name 'settings.gradle.kts' -print -quit || true)"
          fi

          if [ -z "$SETTINGS" ]; then
            echo 'ERROR: No settings.gradle(.kts) found in ZIP.'
            exit 1
          fi

          SOURCE_DIR="$(dirname "$SETTINGS")"

          rm -rf "$PROJECT_DIR"
          mkdir -p "$PROJECT_DIR"

          cp -a "$SOURCE_DIR"/. "$PROJECT_DIR"/

      - name: Verify project and VILA assets
        shell: bash
        run: |
          set -euo pipefail

          test -f "$PROJECT_DIR/settings.gradle" -o -f "$PROJECT_DIR/settings.gradle.kts"
          test -f "$PROJECT_DIR/app/build.gradle" -o -f "$PROJECT_DIR/app/build.gradle.kts"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/assets/index.html"
          test -f "$PROJECT_DIR/app/src/main/assets/vila_avatar.png"
          test -f "$PROJECT_DIR/app/src/main/java/com/vila/ai/MainActivity.java"

          grep -q "versionName '17.2.0'" "$PROJECT_DIR/app/build.gradle"
          grep -q "openai/gpt-oss-120b" "$PROJECT_DIR/app/src/main/assets/index.html"
          grep -q "gemini-3.1-flash-image" "$PROJECT_DIR/app/src/main/assets/index.html"
          grep -q "gemini-3.1-flash-tts-preview" "$PROJECT_DIR/app/src/main/assets/index.html"
          grep -q "startVoiceInput" "$PROJECT_DIR/app/src/main/java/com/vila/ai/MainActivity.java"
          grep -q "saveBase64File" "$PROJECT_DIR/app/src/main/java/com/vila/ai/MainActivity.java"

          echo 'VILA Pro 17.2 verification OK.'

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          gradle clean :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          cp "$APK" \
            "$GITHUB_WORKSPACE/artifacts/VILA-Pro-V17.2-debug.apk"

          sha256sum \
            "$GITHUB_WORKSPACE/artifacts/VILA-Pro-V17.2-debug.apk"

          ls -lh \
            "$GITHUB_WORKSPACE/artifacts/VILA-Pro-V17.2-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: VILA-Pro-V17.2-debug
          path: artifacts/VILA-Pro-V17.2-debug.apk
          if-no-files-found: error
          retention-days: 30
