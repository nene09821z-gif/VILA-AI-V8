name: VILA Pro V17 - Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Tự động giải nén (nếu có file zip)
        run: |
          if ls *.zip 1> /dev/null 2>&1; then
            echo "Tìm thấy file zip, tiến hành giải nén..."
            unzip -o *.zip
            echo "Giải nén thành công."
          else
            echo "Không tìm thấy file zip, bỏ qua bước này."
          fi
          ls -la

      - name: Find Android project root
        id: root
        run: |
          set -euo pipefail
          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          elif [ -f "VILA_AI_V9_Android/settings.gradle" ]; then
            echo "dir=VILA_AI_V9_Android" >> "$GITHUB_OUTPUT"
          else
            FOUND=$(find . -maxdepth 3 \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1 || true)
            if [ -z "$FOUND" ]; then
              echo "::error::Không tìm thấy settings.gradle — hãy đẩy đúng thư mục project Android lên root repo"
              ls -la
              exit 1
            fi
            DIR=$(dirname "$FOUND")
            echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          fi
          echo "Project root: ${{ steps.root.outputs.dir }}"

      - name: Debug Environment
        working-directory: ${{ steps.root.outputs.dir }}
        run: |
          echo "=== Java Version ==="
          java -version
          echo "=== Android SDK Path ==="
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "=== Cấu trúc thư mục ==="
          ls -la
          echo "=== Nội dung file build.gradle (nếu có) ==="
          cat build.gradle 2>/dev/null || cat build.gradle.kts 2>/dev/null || true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Write local.properties
        working-directory: ${{ steps.root.outputs.dir }}
        run: |
          set -euo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -n "$SDK" ]; then
            echo "sdk.dir=$SDK" > local.properties
            echo "Đã tạo file local.properties với SDK: $SDK"
          else
            echo "::warning::Không tìm thấy biến môi trường SDK."
          fi

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: ${{ steps.root.outputs.dir }}
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8"
        run: |
          set -euo pipefail
          echo "Building in: $(pwd)"
          
          # Ưu tiên dùng gradlew của project nếu có
          if [ -f "./gradlew" ]; then
            echo "Sử dụng Gradle Wrapper của project..."
            chmod +x ./gradlew
            ./gradlew assembleDebug --no-daemon --stacktrace --info
          else
            echo "Không tìm thấy gradlew, sử dụng Gradle hệ thống..."
            gradle help --no-daemon || true
            gradle assembleDebug --no-daemon --stacktrace --info
          fi

      - name: Find and upload APK
        working-directory: ${{ steps.root.outputs.dir }}
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1 || true)
          if [ -z "${APK:-}" ]; then
            echo "::error::Build xong nhưng không có APK"
            find app/build -type f 2>/dev/null | head -n 100 || true
            exit 1
          fi
          cp "$APK" "$GITHUB_WORKSPACE/VILA-Pro-V17-debug.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VILA-Pro-V17-debug
          path: VILA-Pro-V17-debug.apk
          if-no-files-found: error
          retention-days: 30
