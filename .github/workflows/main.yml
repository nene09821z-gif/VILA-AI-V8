name: VILA Pro V17.2.1 - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: vila-pro-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "35"
  BUILD_TOOLS: "35.0.0"

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK Components
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-${ANDROID_API}" "build-tools;${BUILD_TOOLS}" "platform-tools"

      - name: Locate Android Project Root
        shell: bash
        run: |
          set -e
          # Tìm file build ở mọi độ sâu thư mục (bỏ qua thư mục build ẩn)
          FOUND_FILE=$(find . -not -path '*/.*' -not -path '*/build/*' \( -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "build.gradle" -o -name "build.gradle.kts" \) | head -n 1)

          if [ -n "$FOUND_FILE" ]; then
            PROJECT_DIR=$(dirname "$FOUND_FILE")
          else
            PROJECT_DIR="."
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Phát hiện thư mục dự án Android tại: $PROJECT_DIR"

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          # Tự động tạo gradlew nếu dự án chưa có wrapper
          if [ ! -f "./gradlew" ]; then
            echo "Chưa có gradlew, tiến hành tạo wrapper..."
            gradle wrapper
          fi

          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify and Collect APK
        shell: bash
        run: |
          set -e
          mkdir -p artifacts

          # Tìm file APK sinh ra trong thư mục outputs
          APK_FILE=$(find "$PROJECT_DIR" -type f -name "*.apk" -path "*/outputs/apk/*" | head -n 1)

          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "::error::Không tìm thấy file APK sau khi build thành công."
            exit 1
          fi

          cp "$APK_FILE" "artifacts/VILA-Pro-V17.2.1-debug.apk"

          echo "Đã đóng gói APK thành công:"
          ls -lh artifacts/VILA-Pro-V17.2.1-debug.apk
          echo "Mã SHA256:"
          sha256sum artifacts/VILA-Pro-V17.2.1-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VILA-Pro-V17.2.1-debug
          path: artifacts/VILA-Pro-V17.2.1-debug.apk
          if-no-files-found: error
          retention-days: 30
          
