name: Build VILA AI STUDIO

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Extract source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="VILA_AI_V54_FULL_SYSTEM.zip"

          if [ -f "$ZIP_FILE" ]; then
            unzip -o -q "$ZIP_FILE"
            rm -f "$ZIP_FILE"
          else
            echo "Không có ZIP ở thư mục gốc, sử dụng source hiện tại."
          fi

          echo "=== Source files ==="
          ls -lah

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

          yes | sdkmanager --licenses || true

      - name: Find Android project
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          ROOT_FILE="$(find . -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.git/*' \
            -not -path '*/.gradle/*' \
            -not -path '*/build/*' \
            -print -quit)"

          if [ -n "$ROOT_FILE" ]; then
            PROJECT_DIR="$(dirname "$ROOT_FILE")"
          else
            MANIFEST="$(find . -type f \
              -path '*/src/main/AndroidManifest.xml' \
              -not -path '*/.git/*' \
              -not -path '*/.gradle/*' \
              -not -path '*/build/*' \
              -print -quit)"

            if [ -n "$MANIFEST" ]; then
              MODULE_DIR="$(dirname "$(dirname "$(dirname "$MANIFEST")")")"
              PROJECT_DIR="$(dirname "$MODULE_DIR")"

              if [ ! -f "$PROJECT_DIR/build.gradle" ] && \
                 [ ! -f "$PROJECT_DIR/build.gradle.kts" ]; then
                PROJECT_DIR="$MODULE_DIR"
              fi
            elif [ -f "./build.gradle" ] || \
                 [ -f "./build.gradle.kts" ]; then
              PROJECT_DIR="."
            else
              echo "::error::Không tìm thấy dự án Android/Gradle."
              find . -maxdepth 5 -type f | head -200
              exit 1
            fi
          fi

          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project: $PROJECT_DIR"
          ls -lah "$PROJECT_DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Gradle wrapper
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "./gradlew" ]; then
            echo "::error::Dự án không có gradlew. Hãy thêm Gradle Wrapper tương thích với dự án."
            exit 1
          fi

          chmod +x ./gradlew
          ./gradlew --version

      - name: Get Android signing SHA-1
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          ./gradlew --no-daemon signingReport \
            2>&1 | tee "$RUNNER_TEMP/signing-report.txt"

          echo "=== SHA-1 fingerprints ==="
          grep -i -E 'Variant:|Config:|Store:|Alias:|SHA1:' \
            "$RUNNER_TEMP/signing-report.txt" || true

          if ! grep -qi 'SHA1:' "$RUNNER_TEMP/signing-report.txt"; then
            echo "::warning::Không thấy SHA-1. Kiểm tra Android Gradle Plugin và signing configuration."
          fi

      - name: Build Debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon assembleDebug

      - name: Collect APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/output"

          find "$PROJECT_DIR" -type f -name '*.apk' \
            -not -path '*/build/intermediates/*' \
            -not -path '*/build/outputs/apk/androidTest/*' \
            -exec cp {} "$GITHUB_WORKSPACE/output/" \;

          if ! find "$GITHUB_WORKSPACE/output" \
            -maxdepth 1 -type f -name '*.apk' | grep -q .; then
            echo "::error::Không tìm thấy APK sau khi build."
            exit 1
          fi

          ls -lh "$GITHUB_WORKSPACE/output"

      - name: Package source ZIP
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail

          cd "$PROJECT_DIR"

          zip -qr "$GITHUB_WORKSPACE/output/VILA_AI_SOURCE.zip" . \
            -x '*/.git/*' \
               '*/.gradle/*' \
               '*/build/*' \
               '*/local.properties' \
               '*/.env' \
               '*/.env.*' \
               '*/google-services.json' \
               '*/keystore.properties' \
               '*/signing.properties' \
               '*/secrets/*' \
               '*.jks' \
               '*.keystore'

      - name: Upload APK and source
        uses: actions/upload-artifact@v4
        with:
          name: VILA-AI-Android-Build
          path: output/*
          if-no-files-found: error
          retention-days: 7
