name: Build VILA AI STUDIO

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # 1. Lấy mã nguồn từ GitHub
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2. Giải nén ZIP VILA AI
      - name: Extract VILA AI source ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="VILA_AI_V54_FULL_SYSTEM.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Không tìm thấy $ZIP_FILE ở thư mục gốc repository."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/vila-source"
          unzip -o -q "$ZIP_FILE" -d "$RUNNER_TEMP/vila-source"
          cp -a "$RUNNER_TEMP/vila-source/." "$GITHUB_WORKSPACE/"
          echo "=== Files after extraction ==="
          ls -lah

      # 3. Cài Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. Cài đặt Android SDK
      - name: Setup Android SDK Manually
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          CMDLINE_TOOLS_BIN=$(find $ANDROID_HOME/cmdline-tools -type d -name "bin" | head -n 1)
          if [ -z "$CMDLINE_TOOLS_BIN" ]; then
            echo "::error::Không tìm thấy cmdline-tools trên runner."
            exit 1
          fi
          export PATH="$CMDLINE_TOOLS_BIN:$ANDROID_HOME/platform-tools:$PATH"
          echo "=== Đang chấp nhận licenses ==="
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          echo "=== Đang cài đặt các gói SDK ==="
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"
          echo "=== Các gói SDK đã cài đặt ==="
          sdkmanager --list_installed

      # 5. Tìm dự án Android
      - name: Find Android project
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          WRAPPER="$(find "$GITHUB_WORKSPACE" -type f \
            -name gradlew \
            -not -path '*/.git/*' \
            -not -path '*/.gradle/*' \
            -not -path '*/build/*' \
            -print -quit)"
          if [ -n "$WRAPPER" ]; then
            PROJECT_DIR="$(dirname "$WRAPPER")"
          else
            ROOT_FILE="$(find "$GITHUB_WORKSPACE" -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -not -path '*/.git/*' \
              -not -path '*/.gradle/*' \
              -not -path '*/build/*' \
              -print -quit)"
            if [ -n "$ROOT_FILE" ]; then
              PROJECT_DIR="$(dirname "$ROOT_FILE")"
            else
              echo "::error::Không tìm thấy gradlew hoặc settings.gradle."
              find "$GITHUB_WORKSPACE" -maxdepth 6 -type f | head -200
              exit 1
            fi
          fi
          PROJECT_DIR="$(realpath "$PROJECT_DIR")"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "=== Android project ==="
          echo "$PROJECT_DIR"
          ls -lah "$PROJECT_DIR"

      # 6. Tự động tạo Gradle Wrapper nếu bị thiếu
      - name: Verify and Create Gradle Wrapper
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "./gradlew" ]; then
            echo "::warning::Dự án thiếu Gradle Wrapper. Đang cố gắng tạo tự động..."
            if command -v gradle &> /dev/null; then
              gradle wrapper
            else
              echo "::error::Không tìm thấy lệnh 'gradle' trên hệ thống."
              exit 1
            fi
          fi
          chmod +x ./gradlew
          ./gradlew --version

      # 7. DEBUG: Kiểm tra cấu trúc dự án trước khi build (Đã sửa lỗi Broken pipe)
      - name: Debug Project Structure
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          echo "=== Cấu trúc thư mục dự án (Giới hạn độ sâu) ==="
          find . -maxdepth 2 -type d | sort
          echo "=== Các file ở thư mục gốc ==="
          ls -lah
          echo "=== Kiểm tra file build.gradle module app ==="
          if [ -f "app/build.gradle" ]; then
            echo "Đã tìm thấy app/build.gradle"
            cat app/build.gradle
          elif [ -f "app/build.gradle.kts" ]; then
            echo "Đã tìm thấy app/build.gradle.kts"
            cat app/build.gradle.kts
          else
            echo "::warning::Không tìm thấy file build.gradle của module app."
          fi
          echo "=== Kiểm tra file settings.gradle ==="
          ls -lah settings.gradle* || true
          echo "=== Kiểm tra Gradle Wrapper ==="
          ls -lah gradlew gradle/wrapper/gradle-wrapper.properties || true

      # 8. BUILD APK DEBUG (Bước quan trọng nhất)
      - name: Build Debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          # Lệnh build APK debug
          ./gradlew --no-daemon --stacktrace --warning-mode all assembleDebug

      # 9. Tìm và kiểm tra APK
      - name: Collect APK
        id: collect
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/output"
          find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/*/*.apk' \
            -not -path '*/androidTest/*' \
            -exec cp {} "$GITHUB_WORKSPACE/output/" \;
          APK_COUNT="$(find "$GITHUB_WORKSPACE/output" \
            -maxdepth 1 -type f -name '*.apk' | wc -l)"
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "::error::Build không tạo được APK."
            exit 1
          fi
          echo "=== APK output ==="
          ls -lh "$GITHUB_WORKSPACE/output"

      # 10. Upload APK để tải về
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VILA-AI-APK
          path: output/*.apk
          if-no-files-found: error
          retention-days: 7
