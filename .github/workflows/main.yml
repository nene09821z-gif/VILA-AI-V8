name: VILA V15 Gemini Enhanced

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build VILA V15 APK
    runs-on: ubuntu-latest

    steps:

      # ==============================
      # 1. Checkout
      # ==============================
      - name: Checkout
        uses: actions/checkout@v4

      # ==============================
      # 2. Java 17
      # ==============================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ==============================
      # 3. Node.js 20
      # ==============================
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ==============================
      # 4. Gradle
      # ==============================
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # ==============================
      # 5. Kiểm tra project
      # ==============================
      - name: Check project structure
        shell: bash
        run: |
          set -e

          echo "===== PROJECT ====="
          pwd

          echo
          echo "===== FILES ====="
          find . -maxdepth 4 -type f | sort | head -300

          echo
          echo "===== REQUIRED FILES ====="

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html

          echo "Project structure OK."

      # ==============================
      # 6. Kiểm tra server nếu có
      # ==============================
      - name: Check server
        shell: bash
        run: |
          if [ -f server/server.js ]; then
            echo "Checking server/server.js"
            node --check server/server.js
          else
            echo "No server/server.js - skipping"
          fi

      # ==============================
      # 7. Kiểm tra JavaScript
      # ==============================
      - name: Check JavaScript
        shell: bash
        run: |
          set -e

          FOUND=0

          while IFS= read -r file; do
            FOUND=1

            echo "Checking:"
            echo "$file"

            node --check "$file"

          done < <(
            find app/src/main/assets \
              -type f \
              -name "*.js" \
              -print
          )

          if [ "$FOUND" -eq 0 ]; then
            echo "No external JavaScript files found."
          fi

          echo "JavaScript check completed."

      # ==============================
      # 8. Build APK
      # ==============================
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          echo "===== GRADLE VERSION ====="
          gradle --version

          echo
          echo "===== BUILD ====="

          gradle \
            clean \
            assembleDebug \
            --stacktrace \
            --no-daemon

      # ==============================
      # 9. Tìm APK
      # ==============================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          echo "===== APK ====="

          find app/build/outputs \
            -type f \
            -name "*.apk" \
            -print

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo
          echo "APK BUILD SUCCESS:"
          ls -lh "$APK"

      # ==============================
      # 10. Upload APK
      # ==============================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VILA-V15-Gemini-Enhanced-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # ==============================
      # 11. Upload build outputs
      # ==============================
      - name: Upload build outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VILA-V15-build-logs
          path: |
            app/build/outputs/**
            app/build/reports/**
          if-no-files-found: ignore
          retention-days: 7
