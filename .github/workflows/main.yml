name: VILA AI VIP Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract VILA ZIP
        run: |
          mkdir -p vila
          unzip -o VILA_AI_V16_VIP_FIXED_GITHUB.zip -d vila

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd vila
          PROJECT=$(find . -name settings.gradle -o -name settings.gradle.kts | head -1)
          cd "$(dirname "$PROJECT")"
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VILA-AI-VIP-APK
          path: vila/**/build/outputs/apk/debug/*.apk
