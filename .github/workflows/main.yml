name: VILA AI V16 - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build app-debug.apk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Find or extract Android project
        shell: bash
        run: |
          set -e

          echo "=== FIND ANDROID PROJECT ==="

          SETTINGS_FILE=$(find . \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            ! -path "./.git/*" \
            ! -path "./.vila_extract/*" \
            | head -n 1 || true)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "Android project not found."
            echo "Searching ZIP..."

            ZIP_FILE=$(find . \
              -type f \
              -iname "*.zip" \
              ! -path "./.git/*" \
              ! -path "./.vila_extract/*" \
              | head -n 1 || true)

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No Android project or ZIP found."
              exit 1
            fi

            echo "ZIP found:"
            echo "$ZIP_FILE"

            rm -rf .vila_extract
            mkdir -p .vila_extract

            echo "Extracting ZIP..."
            unzip -q -o "$ZIP_FILE" -d .vila_extract

            SETTINGS_FILE=$(find .vila_extract \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              | head -n 1 || true)

            if [ -z "$SETTINGS_FILE" ]; then
              echo "ERROR: settings.gradle not found after extraction."
              echo "Extracted files:"
              find .vila_extract -maxdepth 5 -type f | head -200
              exit 1
            fi
          fi

          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          PROJECT_DIR=$(realpath "$PROJECT_DIR")

          echo "Android project:"
          echo "$PROJECT_DIR"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: app directory not found."
            echo "Project contents:"
            ls -la "$PROJECT_DIR"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "=== PROJECT FOUND ==="
          ls -la "$PROJECT_DIR"

      - name: Build app-debug.apk
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=== BUILD DEBUG APK ==="

          gradle assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find app-debug.apk
        shell: bash
        run: |
          set -e

          echo "=== SEARCH APK ==="

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "app-debug.apk" \
            | head -n 1 || true)

          if [ -z "$APK" ]; then
            echo "ERROR: app-debug.apk not found."

            echo "Available APK files:"
            find "$PROJECT_DIR/app/build/outputs" \
              -type f \
              -name "*.apk" \
              2>/dev/null || true

            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/app-debug.apk"

          echo "APK READY:"
          ls -lh "$GITHUB_WORKSPACE/app-debug.apk"

      - name: Upload app-debug.apk
        uses: actions/upload-artifact@v4
        with:
          name: VILA-AI-V16-debug
          path: app-debug.apk
          if-no-files-found: error
          retention-days: 30
