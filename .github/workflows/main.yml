name: Build VILA AI V32

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ===== BƯỚC TỰ ĐỘNG GIẢI NÉN ZIP (ĐÃ CẬP NHẬT TÊN FILE MỚI) =====
      - name: Extract source ZIP
        shell: bash
        run: |
          set -e
          # Đã cập nhật tên file ZIP mới tại đây
          ZIP_FILE="VILA_AI_ANDROID_BUILD_SHA1_FIXED.zip"
          
          if [ -f "$ZIP_FILE" ]; then
            echo "Đang giải nén $ZIP_FILE..."
            # Thêm -o để tự động ghi đè nếu file đã tồn tại
            unzip -o -q "$ZIP_FILE"
            echo "Giải nén thành công!"
            # Xóa file zip sau khi giải nén để tránh nhầm lẫn
            rm -f "$ZIP_FILE"
            echo "=== Các file sau khi giải nén ==="
            ls -la
          else
            echo "Không tìm thấy file ZIP ở thư mục gốc. Bỏ qua bước này."
          fi
      # ==================================================

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ===== BƯỚC MỚI: LẤY SHA-1 TỪ KEYSTORE =====
      - name: Get SHA-1 Fingerprint
        shell: bash
        run: |
          set -e
          echo "Đang lấy mã SHA-1 từ file keystore..."
          
          # Kiểm tra xem file keystore có tồn tại không
          if [ ! -f "${{ secrets.KEYSTORE_PATH }}" ]; then
            echo "::error::Không tìm thấy file keystore tại đường dẫn: ${{ secrets.KEYSTORE_PATH }}"
            echo "Hãy chắc chắn bạn đã tải file release-key.jks lên GitHub và điền đúng Secret KEYSTORE_PATH."
            exit 1
          fi
          
          # Chạy lệnh keytool và chỉ lọc ra dòng chứa SHA1
          keytool -list -v -keystore "${{ secrets.KEYSTORE_PATH }}" -alias "${{ secrets.KEY_ALIAS }}" -storepass "${{ secrets.KEYSTORE_PASSWORD }}" -keypass "${{ secrets.KEY_PASSWORD }}" | grep -i "SHA1:"
      # ==========================================

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          # Cập nhật lên API 36 và Build-tools 36.0.0 để tương thích với Gradle 9.x
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"
          yes | sdkmanager --licenses || true

      - name: Find Android project
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Workspace ==="
          pwd
          ls -lah

          echo "=== Gradle files ==="
          find . -type f \( \
            -name settings.gradle \
            -o -name settings.gradle.kts \
          \) -not -path '*/.gradle/*' -print

          ROOT_FILE="$(find . -type f \( \
            -name settings.gradle \
            -o -name settings.gradle.kts \
          \) -not -path '*/.gradle/*' -print -quit)"

          if [ -n "$ROOT_FILE" ]; then
            PROJECT_DIR="$(dirname "$ROOT_FILE")"
          else
            # Fallback: locate a module containing AndroidManifest.xml
            MANIFEST="$(find . -type f \
              -path '*/src/main/AndroidManifest.xml' \
              -not -path '*/.gradle/*' \
              -print -quit)"

            if [ -n "$MANIFEST" ]; then
              MODULE_DIR="$(dirname "$(dirname "$(dirname "$MANIFEST")")")"
              PROJECT_DIR="$(dirname "$MODULE_DIR")"

              if [ ! -f "$PROJECT_DIR/build.gradle" ] && \
                 [ ! -f "$PROJECT_DIR/build.gradle.kts" ]; then
                PROJECT_DIR="$MODULE_DIR"
              fi
            elif [ -f "./build.gradle" ] || [ -f "./build.gradle.kts" ]; then
              PROJECT_DIR="."
            else
              echo "::error::Không tìm thấy dự án Android."
              echo "Các file hiện có:"
              find . -maxdepth 5 -type f | head -200
              exit 1
            fi
          fi

          PROJECT_DIR="$(realpath "$PROJECT_DIR")"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Project: $PROJECT_DIR"
          ls -lah "$PROJECT_DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # ĐÃ SỬA: Nâng cấp lên 9.3.1 để giải quyết lỗi "Minimum supported Gradle version is 9.3.1"
          gradle-version: '9.3.1'

      - name: Build Debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Collect APK
        id: apk
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/output"
          PROJECT_DIR="${{ steps.locate.outputs.project_dir }}"

          find "$PROJECT_DIR" -type f -name '*.apk' \
            -not -path '*/build/intermediates/*' \
            -exec cp {} "$GITHUB_WORKSPACE/output/" \;

          if ! find "$GITHUB_WORKSPACE/output" -type f -name '*.apk' | grep -q .; then
            echo "::error::Build xong nhưng không tìm thấy APK."
            exit 1
          fi

          ls -lh "$GITHUB_WORKSPACE/output"

      - name: Package source ZIP
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_DIR="${{ steps.locate.outputs.project_dir }}"

          cd "$PROJECT_DIR"
          zip -qr "$GITHUB_WORKSPACE/output/VILA_AI_SOURCE.zip" . \
            -x '*/.git/*' '*/.gradle/*' '*/build/*'

      - name: Upload APK and ZIP
        uses: actions/upload-artifact@v4
        with:
          name: VILA-AI-Android-Build
          path: output/*
          if-no-files-found: error
          retention-days: 7
