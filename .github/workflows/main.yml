name: Build VILA Pro APK từ ZIP

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Đã xóa bỏ bước "android-actions/setup-android" tại đây vì ubuntu-latest đã có sẵn SDK

      - name: Cài đặt Android SDK packages
        run: |
          # Chấp nhận tất cả giấy phép của SDK
          yes | sdkmanager --licenses || true
          
          # Cài đặt trực tiếp các gói cần thiết, KHÔNG dùng --update
          echo "Đang cài đặt platform-tools, android-35 và build-tools..."
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Tìm và giải nén file ZIP
        id: unzip
        run: |
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "❌ Không tìm thấy file ZIP nào!"
            exit 1
          fi
          echo "✅ Đã tìm thấy: $ZIP_FILE"
          
          mkdir -p extracted_src
          unzip -q -o "$ZIP_FILE" -d extracted_src
          
          echo "📂 Nội dung sau khi giải nén:"
          ls -la extracted_src
          
          SETTINGS_FILE=$(find extracted_src -name "settings.gradle" -o -name "settings.gradle.kts" | head -n 1)
          if [ -z "$SETTINGS_FILE" ]; then
            echo "❌ Không tìm thấy file settings.gradle trong thư mục giải nén!"
            exit 1
          fi
          
          PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          echo "✅ Đã tìm thấy dự án tại: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Cấu hình Android SDK Path
        run: |
          echo "sdk.dir=${ANDROID_SDK_ROOT}" > ${{ env.PROJECT_DIR }}/local.properties

      - name: Cấp quyền thực thi cho gradlew (nếu có)
        working-directory: ${{ env.PROJECT_DIR }}
        run: chmod +x gradlew || echo "Không có gradlew, sẽ dùng gradle toàn cục"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f ./gradlew ]; then
            echo "🚀 Đang build bằng gradlew..."
            ./gradlew clean assembleDebug --no-daemon --stacktrace
          else
            echo "🚀 Không có gradlew, đang build bằng gradle toàn cục..."
            gradle clean assembleDebug --no-daemon --stacktrace
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VILA-Pro-V20-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
