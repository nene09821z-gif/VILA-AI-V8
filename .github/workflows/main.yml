name: VILA Pro V17 - Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find Android project root
        id: root
        run: |
          set -euo pipefail
          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
            echo "Found project at repo root"
          elif [ -f "VILA_AI_V9_Android/settings.gradle" ]; then
            echo "dir=VILA_AI_V9_Android" >> "$GITHUB_OUTPUT"
            echo "Found project at VILA_AI_V9_Android/"
          else
            FOUND=$(find . -maxdepth 3 \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1 || true)
            if [ -z "$FOUND" ]; then
              echo "::error::Không tìm thấy settings.gradle — hãy đẩy đúng thư mục project Android lên root repo"
              ls -la
              exit 1
            fi
            DIR=$(dirname "$FOUND")
            echo "dir=$DIR" >> "$GITHUB_OUTPUT"
            echo "Found project at $DIR"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          set -euo pipefail
          echo "ANDROID_HOME=${ANDROID_HOME:-}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-}"
          SDK="\( {ANDROID_SDK_ROOT:- \){ANDROID_HOME:-}}"
          if [ -z "$SDK" ]; then
            echo "::error::ANDROID_SDK_ROOT/ANDROID_HOME chưa được set"
            exit 1
          fi
          SM=$(find "$SDK" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)
          if [ -z "$SM" ]; then
            SM=$(which sdkmanager || true)
          fi
          echo "sdkmanager=$SM"
          yes 2>/dev/null | "$SM" --licenses >/dev/null || true
          "$SM" --install "platforms;android-35" "build-tools;34.0.0" "platform-tools" || \
          "$SM" --install "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Write local.properties
        working-directory: ${{ steps.root.outputs.dir }}
        run: |
          set -euo pipefail
          SDK="\( {ANDROID_SDK_ROOT:- \){ANDROID_HOME:-}}"
          echo "sdk.dir=$SDK" > local.properties
          cat local.properties
          ls -la

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: ${{ steps.root.outputs.dir }}
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8"
        run: |
          set -euo pipefail
          echo "Building in: $(pwd)"
          ls -la
          gradle help --no-daemon || true
          gradle assembleDebug --no-daemon --stacktrace

      - name: Find and upload APK
        working-directory: ${{ steps.root.outputs.dir }}
        run: |
          set -euo pipefail
          echo "Searching APK..."
          find app/build/outputs -type f -name "*.apk" -print || true
          APK=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1 || true)
          if [ -z "${APK:-}" ]; then
            echo "::error::Build xong nhưng không có APK"
            find app/build -type f 2>/dev/null | head -n 100 || true
            exit 1
          fi
          echo "Found: $APK"
          ls -lh "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/VILA-Pro-V17-debug.apk"
          ls -lh "$GITHUB_WORKSPACE/VILA-Pro-V17-debug.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VILA-Pro-V17-debug
          path: VILA-Pro-V17-debug.apk
          if-no-files-found: error
          retention-days: 30
