name: VILA Pro V17.2.1 - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: vila-pro-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_DIR: VILA_AI_V9_Android
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "35"
  BUILD_TOOLS: "35.0.0"

jobs:
  build:
    name: Build VILA Pro 17.2.1
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # Checkout
      # -----------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------
      # Java 17
      # -----------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # -----------------------------
      # Gradle
      # -----------------------------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # -----------------------------
      # Android SDK
      # -----------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-${{ env.ANDROID_API }}
            build-tools;${{ env.BUILD_TOOLS }}

      # -----------------------------
      # Verify project location
      # -----------------------------
      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking project..."

          test -d "$PROJECT_DIR"
          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"

          echo "Project found:"
          echo "$PROJECT_DIR"

      # -----------------------------
      # Verify VILA files
      # -----------------------------
      - name: Verify VILA Pro
        shell: bash
        run: |
          set -euo pipefail

          APP="$PROJECT_DIR/app/src/main"

          test -f "$APP/AndroidManifest.xml"
          test -f "$APP/assets/index.html"
          test -f "$APP/java/com/vila/ai/MainActivity.java"

          echo "Checking version..."

          grep -q "17.2.1" \
            "$PROJECT_DIR/app/build.gradle"

          echo "Checking Gemini..."

          grep -qi "gemini" \
            "$APP/assets/index.html"

          echo "Checking Groq..."

          grep -q "openai/gpt-oss-120b" \
            "$APP/assets/index.html"

          echo "Checking GitHub..."

          grep -qi "github" \
            "$APP/assets/index.html"

          echo "Checking enpoiko / VILA Server..."

          grep -qiE \
            "enpoiko|vila.*server|serverUrl|vila_server_url" \
            "$APP/assets/index.html" \
            "$APP/java/com/vila/ai/MainActivity.java"

          echo "VILA Pro verification OK."

      # -----------------------------
      # Validate Gradle
      # -----------------------------
      - name: Gradle environment
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          gradle --version

      # -----------------------------
      # Build APK
      # -----------------------------
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          gradle clean :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # -----------------------------
      # Verify APK
      # -----------------------------
      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          if [ ! -s "$APK" ]; then
            echo "::error::APK is empty."
            exit 1
          fi

          mkdir -p artifacts

          cp "$APK" \
            artifacts/VILA-Pro-V17.2.1-debug.apk

          echo "APK generated successfully:"
          ls -lh artifacts/VILA-Pro-V17.2.1-debug.apk

          echo "SHA256:"
          sha256sum artifacts/VILA-Pro-V17.2.1-debug.apk

      # -----------------------------
      # Upload APK
      # -----------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VILA-Pro-V17.2.1-debug
          path: artifacts/VILA-Pro-V17.2.1-debug.apk
          if-no-files-found: error
          retention-days: 30
