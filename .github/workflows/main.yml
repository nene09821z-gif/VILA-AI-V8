name: Build APK from ZIP

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: vila-pro-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "35"
  BUILD_TOOLS: "35.0.0"

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Chỉ định rõ gói cần thiết để tránh lỗi 'tools' đã bị Google xóa
          packages: 'platform-tools'

      - name: Install Android SDK Components
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-${ANDROID_API}" "build-tools;${BUILD_TOOLS}"

      - name: Extract Project ZIP
        shell: bash
        run: |
          set -e
          # Tìm tệp .zip đầu tiên ở thư mục gốc
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)
          if [ -z "$ZIP_FILE" ]; then
            echo "::error::Không tìm thấy tệp ZIP nào trong repository. Vui lòng kiểm tra lại."
            exit 1
          fi
          echo "Đang giải nén: $ZIP_FILE"
          # Giải nén vào thư mục 'extracted_project'
          unzip -q "$ZIP_FILE" -d extracted_project
          echo "Giải nén hoàn tất."

      - name: Locate Android Project Root
        shell: bash
        run: |
          set -e
          # Tìm file build.gradle hoặc settings.gradle trong thư mục vừa giải nén
          FOUND_FILE=$(find extracted_project -not -path '*/.*' \( -name "settings.gradle" -o -name "settings.gradle.kts" -o -name "build.gradle" -o -name "build.gradle.kts" \) | head -n 1)

          if [ -n "$FOUND_FILE" ]; then
            PROJECT_DIR=$(dirname "$FOUND_FILE")
          else
            echo "::error::Không tìm thấy thư mục dự án Android sau khi giải nén."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Phát hiện thư mục dự án Android tại: $PROJECT_DIR"

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"

          # Tự động tạo gradlew nếu dự án chưa có wrapper
          if [ ! -f "./gradlew" ]; then
            echo "Chưa có gradlew, tiến hành tạo wrapper..."
            gradle wrapper
          fi

          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify and Collect APK
        shell: bash
        run: |
          set -e
          mkdir -p artifacts

          # Tìm file APK sinh ra trong thư mục outputs của dự án đã giải nén
          APK_FILE=$(find "$PROJECT_DIR" -type f -name "*.apk" -path "*/outputs/apk/*" | head -n 1)

          if [ -z "$APK_FILE" ] || [ ! -f "$APK_FILE" ]; then
            echo "::error::Không tìm thấy file APK sau khi build thành công."
            exit 1
          fi

          cp "$APK_FILE" "artifacts/VILA-Pro-Debug.apk"

          echo "Đã đóng gói APK thành công:"
          ls -lh artifacts/VILA-Pro-Debug.apk
          echo "Mã SHA256:"
          sha256sum artifacts/VILA-Pro-Debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VILA-Pro-Debug-APK
          path: artifacts/VILA-Pro-Debug.apk
          if-no-files-found: error
          retention-days: 30
