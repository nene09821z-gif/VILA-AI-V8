name: VILA Pro V17 - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  PROJECT_DIR: VILA_AI_V9_Android
  GRADLE_VERSION: '8.11.1'

jobs:
  build:
    name: Build app-debug.apk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Extract VILA ZIP if project folder is missing
        shell: bash
        run: |
          set -euo pipefail

          if [ -d "$PROJECT_DIR" ] && [ -f "$PROJECT_DIR/settings.gradle" ]; then
            echo "Android project found: $PROJECT_DIR"
            exit 0
          fi

          ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*.zip' ! -path './.git/*' -print -quit || true)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: $PROJECT_DIR was not found and no ZIP archive exists."
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"

          rm -rf .vila_extract
          mkdir -p .vila_extract
          unzip -q -o "$ZIP_FILE" -d .vila_extract

          FOUND="$(find .vila_extract -type f -name 'settings.gradle' -print -quit || true)"

          if [ -z "$FOUND" ]; then
            FOUND="$(find .vila_extract -type f -name 'settings.gradle.kts' -print -quit || true)"
          fi

          if [ -z "$FOUND" ]; then
            echo 'ERROR: No Android Gradle project found in ZIP.'
            exit 1
          fi

          SOURCE_DIR="$(dirname "$FOUND")"
          mkdir -p "$PROJECT_DIR"
          cp -a "$SOURCE_DIR"/. "$PROJECT_DIR"/

          echo "Extracted Android project to: $PROJECT_DIR"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Build app-debug.apk
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK created:"
          ls -lh "$APK"

      - name: Upload app-debug.apk
        uses: actions/upload-artifact@v7
        with:
          name: VILA-Pro-V17-app-debug
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
