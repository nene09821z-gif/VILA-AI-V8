name: VILA AI VIP Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check files
        run: |
          echo "=== FILES ==="
          ls -la
          echo "=== ZIP ==="
          find . -maxdepth 2 -type f -name "*.zip"

      - name: Extract VILA
        run: |
          mkdir -p vila

          ZIP=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "KHONG TIM THAY FILE ZIP"
            exit 1
          fi

          echo "Using: $ZIP"
          unzip -o "$ZIP" -d vila

      - name: Find Android project
        run: |
          echo "=== SEARCH ANDROID PROJECT ==="

          SETTINGS=$(find vila -type f \( \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
          \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "KHONG TIM THAY settings.gradle"
            find vila -maxdepth 5 -type f | head -100
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VILA-AI-VIP-APK
          path: |
            vila/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
