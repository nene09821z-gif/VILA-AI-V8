name: VILA AI - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "35"
  BUILD_TOOLS: "35.0.0"

jobs:
  build:
    name: Build VILA AI APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. CHECKOUT
      # ==========================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. JAVA 17
      # ==========================================

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}


      # ==========================================
      # 3. GRADLE 8.11.1
      # ==========================================

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}


      # ==========================================
      # 4. FIND / EXTRACT PROJECT
      # ==========================================

      - name: Find or extract Android project
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SEARCHING ANDROID PROJECT"
          echo "=========================================="

          PROJECT_DIR=""

          # Tìm project đã giải nén
          SETTINGS_FILE=$(find . \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            ! -path "./.git/*" \
            | head -n 1 || true)

          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
            echo "Found project:"
            echo "$PROJECT_DIR"
          fi

          # Nếu chưa có project -> tìm ZIP
          if [ -z "$PROJECT_DIR" ]; then

            echo "Android project not found."
            echo "Searching ZIP..."

            ZIP_FILE=$(find . \
              -type f \
              -iname "*.zip" \
              ! -path "./.git/*" \
              | head -n 1 || true)

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No Android project or ZIP found."
              exit 1
            fi

            echo "ZIP:"
            echo "$ZIP_FILE"

            mkdir -p .vila_extract

            unzip -o "$ZIP_FILE" -d .vila_extract

            SETTINGS_FILE=$(find .vila_extract \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              | head -n 1 || true)

            if [ -z "$SETTINGS_FILE" ]; then
              echo "ERROR: No settings.gradle found after extraction."
              find .vila_extract -maxdepth 5 -type f | head -200
              exit 1
            fi

            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

            echo "Extracted project:"
            echo "$PROJECT_DIR"

          fi

          PROJECT_DIR="$(realpath "$PROJECT_DIR")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo ""
          echo "=========================================="
          echo "PROJECT FILES"
          echo "=========================================="

          ls -la "$PROJECT_DIR"


      # ==========================================
      # 5. USE PREINSTALLED ANDROID SDK
      # ==========================================

      - name: Configure Android SDK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "ANDROID SDK"
          echo "=========================================="

          if [ -n "${ANDROID_HOME:-}" ]; then
            SDK="$ANDROID_HOME"
          elif [ -n "${ANDROID_SDK_ROOT:-}" ]; then
            SDK="$ANDROID_SDK_ROOT"
          else
            SDK="$HOME/android-sdk"
          fi

          echo "SDK: $SDK"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          # Tìm sdkmanager
          SDKMANAGER=$(find "$SDK" \
            -type f \
            -name sdkmanager \
            -perm -111 \
            2>/dev/null \
            | head -n 1 || true)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          SDKMANAGER_DIR="$(dirname "$SDKMANAGER")"

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo "$SDKMANAGER_DIR" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

          echo "sdkmanager:"
          "$SDKMANAGER" --version


      # ==========================================
      # 6. ACCEPT LICENSES
      # ==========================================

      - name: Accept Android licenses
        shell: bash
        run: |
          set +e

          SDK="${ANDROID_HOME}"

          mkdir -p "$SDK/licenses"

          cat > "$SDK/licenses/android-sdk-license" <<'EOF'
8933bad161af4178b1185d1a37fbf41ea5269c55
84831b9409646a918e30573bab4c9c91346d8abd
d56f5187479451eabf01fb78af6dfcb131a6481e
24333f8a63b6825ea9c5514f83c2829b004d1fee
EOF

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          echo "Android licenses accepted."


      # ==========================================
      # 7. INSTALL REQUIRED SDK
      # ==========================================

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -e

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          echo ""
          echo "Installed packages:"
          "$SDKMANAGER" --list_installed


      # ==========================================
      # 8. CHECK PROJECT
      # ==========================================

      - name: Validate Android project
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "Checking Gradle project..."

          if [ ! -f "settings.gradle" ] && \
             [ ! -f "settings.gradle.kts" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          if [ ! -f "build.gradle" ] && \
             [ ! -f "build.gradle.kts" ]; then
            echo "ERROR: root build.gradle not found."
            exit 1
          fi

          if [ ! -d "app" ]; then
            echo "ERROR: app directory not found."
            exit 1
          fi

          echo "Android project OK."


      # ==========================================
      # 9. CHECK NODE SERVER
      # ==========================================

      - name: Validate VILA server
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          if [ -f "server/server.js" ]; then
            echo "Checking server/server.js..."
            node --check server/server.js
            echo "Server syntax OK."
          else
            echo "server/server.js not found."
            echo "Skipping server check."
          fi


      # ==========================================
      # 10. BUILD APK
      # ==========================================

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "BUILDING VILA AI APK"
          echo "=========================================="

          gradle \
            clean \
            assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all


      # ==========================================
      # 11. FIND APK
      # ==========================================

      - name: Find APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "APK OUTPUT"
          echo "=========================================="

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find app/build/outputs/apk \
            -type f \
            -name "app-debug.apk" \
            | head -n 1 || true)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"


      # ==========================================
      # 12. RENAME APK
      # ==========================================

      - name: Rename APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          APK=$(find app/build/outputs/apk \
            -type f \
            -name "app-debug.apk" \
            | head -n 1)

          cp "$APK" \
            "app/build/outputs/apk/debug/VILA-AI-V16.apk"

          ls -lh \
            "app/build/outputs/apk/debug/VILA-AI-V16.apk"


      # ==========================================
      # 13. UPLOAD APK
      # ==========================================

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VILA-AI-V16-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/VILA-AI-V16.apk
          if-no-files-found: error
          retention-days: 30
