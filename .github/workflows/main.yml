name: VILA Pro V17.2.1 - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: vila-pro-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "35"
  BUILD_TOOLS: "35.0.0"

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Java
        run: |
          set -e
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -e

          sdkmanager --licenses || true

          sdkmanager \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          PROJECT_DIR="$(find . -name settings.gradle -not -path '*/build/*' | head -n 1 | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Android project with settings.gradle was not found."
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found Android project: $PROJECT_DIR"

      - name: Verify Android project
        shell: bash
        run: |
          set -e

          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/java/com/vila/ai/MainActivity.java"
          test -f "$PROJECT_DIR/app/src/main/assets/index.html"

          echo "Android project structure OK."

      - name: Verify VILA configuration
        shell: bash
        run: |
          set -e

          APP="$PROJECT_DIR/app"

          grep -q "versionCode 20" "$APP/build.gradle"
          grep -q "versionName '17.2.1'" "$APP/build.gradle"
          grep -q "compileSdk 35" "$APP/build.gradle"

          grep -q "openai/gpt-oss-120b" \
            "$APP/src/main/assets/index.html"

          grep -qi "gemini" \
            "$APP/src/main/assets/index.html"

          grep -qi "github" \
            "$APP/src/main/assets/index.html"

          # Giữ VILA Server / enpoiko
          grep -RniE "enpoiko|vila_server_url|serverUrl" \
            "$APP/src/main/assets" \
            "$APP/src/main/java" \
            >/dev/null

          echo "VILA configuration OK."

      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          gradle clean :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -s "$APK" ]; then
            echo "::error::APK was not generated."
            exit 1
          fi

          mkdir -p artifacts
          cp "$APK" "artifacts/VILA-Pro-V17.2.1-debug.apk"

          echo "APK generated:"
          ls -lh artifacts/VILA-Pro-V17.2.1-debug.apk

          echo "SHA256:"
          sha256sum artifacts/VILA-Pro-V17.2.1-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VILA-Pro-V17.2.1-debug
          path: artifacts/VILA-Pro-V17.2.1-debug.apk
          if-no-files-found: error
          retention-days: 30
