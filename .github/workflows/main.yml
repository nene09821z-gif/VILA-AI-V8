name: VILA V15 Gemini Enhanced

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build VILA V15 APK
    runs-on: ubuntu-latest

    steps:
      # ==========================================
      # 1. Checkout source
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # 2. Java 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ==========================================
      # 3. Node.js 20
      # ==========================================
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ==========================================
      # 4. Setup Gradle 8.9
      # ==========================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # ==========================================
      # 5. Kiểm tra cấu trúc project
      # ==========================================
      - name: Check project structure
        shell: bash
        run: |
          set -e

          echo "===== PROJECT ====="

          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html
          test -f server/server.js

          echo "Project structure OK."

      # ==========================================
      # 6. Kiểm tra JavaScript trong index.html
      # ==========================================
      - name: Check VILA JavaScript
        shell: bash
        run: |
          set -e

          python3 <<'PY'
          import re
          from pathlib import Path

          html_path = Path("app/src/main/assets/index.html")

          html = html_path.read_text(
              encoding="utf-8",
              errors="replace"
          )

          # Lấy toàn bộ script inline
          blocks = re.findall(
              r"<script\b[^>]*>(.*?)</script>",
              html,
              flags=re.IGNORECASE | re.DOTALL
          )

          if not blocks:
              print("No inline JavaScript found.")
              raise SystemExit(0)

          # Kiểm tra từng block riêng biệt
          for i, code in enumerate(blocks, start=1):

              # Bỏ qua script chỉ có src
              if not code.strip():
                  continue

              output = Path(f"/tmp/vila-script-{i}.js")

              output.write_text(
                  code,
                  encoding="utf-8"
              )

              print(
                  f"Checking inline JavaScript block {i}: "
                  f"{len(code)} bytes"
              )
          PY

          for file in /tmp/vila-script-*.js; do
            if [ -f "$file" ]; then
              echo "node --check $file"
              node --check "$file"
            fi
          done

          echo "VILA JavaScript syntax OK."

      # ==========================================
      # 7. Kiểm tra server
      # ==========================================
      - name: Check server JavaScript
        run: |
          node --check server/server.js

      # ==========================================
      # 8. Kiểm tra package.json
      # ==========================================
      - name: Check server package
        run: |
          node -e "
            const fs = require('fs');
            const p = JSON.parse(
              fs.readFileSync('server/package.json', 'utf8')
            );

            if (!p.name) {
              throw new Error('Invalid server/package.json');
            }

            console.log('Server package:', p.name);
          "

      # ==========================================
      # 9. Kiểm tra Android Gradle project
      # ==========================================
      - name: Validate Gradle project
        run: |
          gradle tasks --all --no-daemon

      # ==========================================
      # 10. Build APK Debug
      # ==========================================
      - name: Build Debug APK
        run: |
          gradle \
            clean \
            assembleDebug \
            --stacktrace \
            --no-daemon

      # ==========================================
      # 11. Kiểm tra APK
      # ==========================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK was not generated."
            echo
            echo "Available output files:"
            find app/build/outputs \
              -type f \
              -print \
              || true
            exit 1
          fi

          echo "APK successfully generated:"
          ls -lh "$APK"

      # ==========================================
      # 12. Upload APK
      # ==========================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VILA-V15-Gemini-Enhanced-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # ==========================================
      # 13. Upload mapping/build information
      # ==========================================
      - name: Upload build information
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VILA-V15-build-info
          path: |
            app/build/outputs/**/*.txt
            app/build/outputs/**/*.json
          if-no-files-found: ignore
          retention-days: 7
