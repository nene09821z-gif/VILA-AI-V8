name: VILA V15 - Auto Build APK

on:
  workflow_dispatch:

  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # =====================================
      # TỰ TÌM ZIP VÀ GIẢI NÉN
      # =====================================
      - name: Extract VILA ZIP
        shell: bash
        run: |
          set -e

          mkdir -p vila-build

          ZIP=$(find . \
            -type f \
            -name "*.zip" \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "Không tìm thấy file ZIP."
            exit 1
          fi

          echo "ZIP:"
          echo "$ZIP"

          unzip -q "$ZIP" -d vila-build

          echo "Đã giải nén."

      # =====================================
      # TÌM ROOT ANDROID PROJECT
      # =====================================
      - name: Find Android project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find vila-build \
            -type f \
            -name "settings.gradle" \
            -print \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "Không tìm thấy settings.gradle."
            echo
            echo "Cấu trúc ZIP:"
            find vila-build -maxdepth 5 -type f | sort
            exit 1
          fi

          ROOT=$(dirname "$SETTINGS")

          echo "$ROOT" > /tmp/vila-root

          echo "Android project:"
          echo "$ROOT"

          test -f "$ROOT/build.gradle"
          test -f "$ROOT/app/build.gradle"
          test -f "$ROOT/app/src/main/AndroidManifest.xml"

      # =====================================
      # CHECK JAVASCRIPT
      # =====================================
      - name: Check JavaScript
        shell: bash
        run: |
          set -e

          ROOT=$(cat /tmp/vila-root)

          if [ -d "$ROOT/app/src/main/assets" ]; then

            while IFS= read -r file; do
              echo "Checking:"
              echo "$file"

              node --check "$file"

            done < <(
              find "$ROOT/app/src/main/assets" \
                -type f \
                -name "*.js"
            )

          fi

      # =====================================
      # CHECK SERVER
      # =====================================
      - name: Check server
        shell: bash
        run: |
          ROOT=$(cat /tmp/vila-root)

          if [ -f "$ROOT/server/server.js" ]; then
            node --check "$ROOT/server/server.js"
          fi

      # =====================================
      # BUILD APK
      # =====================================
      - name: Build APK
        shell: bash
        run: |
          set -e

          ROOT=$(cat /tmp/vila-root)

          cd "$ROOT"

          echo "Building:"
          pwd

          gradle \
            clean \
            assembleDebug \
            --stacktrace \
            --no-daemon

      # =====================================
      # KIỂM TRA APK
      # =====================================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          ROOT=$(cat /tmp/vila-root)

          APK="$ROOT/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then

            echo "APK không được tạo."

            find "$ROOT/app/build/outputs" \
              -type f \
              -print || true

            exit 1
          fi

          echo "=============================="
          echo "BUILD SUCCESS"
          echo "=============================="

          ls -lh "$APK"

      # =====================================
      # UPLOAD APK
      # =====================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VILA-V15-APK
          path: vila-build/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
