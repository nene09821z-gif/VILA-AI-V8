name: VILA AI V16 - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build app-debug.apk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find or extract Android project
        shell: bash
        run: |
          set -e

          echo "=== FIND ANDROID PROJECT ==="

          GRADLEW=$(find . \
            -type f \
            -name "gradlew" \
            ! -path "./.git/*" \
            | head -n 1 || true)

          if [ -z "$GRADLEW" ]; then
            echo "gradlew not found."
            echo "Searching ZIP..."

            ZIP_FILE=$(find . \
              -type f \
              -iname "*.zip" \
              ! -path "./.git/*" \
              | head -n 1 || true)

            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No gradlew and no ZIP found."
              exit 1
            fi

            echo "ZIP found:"
            echo "$ZIP_FILE"

            rm -rf .vila_extract
            mkdir -p .vila_extract

            echo "Extracting ZIP..."
            unzip -q -o "$ZIP_FILE" -d .vila_extract

            GRADLEW=$(find .vila_extract \
              -type f \
              -name "gradlew" \
              | head -n 1 || true)

            if [ -z "$GRADLEW" ]; then
              echo "ERROR: gradlew not found after extraction."
              exit 1
            fi
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          PROJECT_DIR=$(realpath "$PROJECT_DIR")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project:"
          echo "$PROJECT_DIR"

          echo "=== PROJECT FILES ==="
          ls -la "$PROJECT_DIR"

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: app directory not found."
            exit 1
          fi

      - name: Build app-debug.apk
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          chmod +x ./gradlew

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" \
            -type f \
            -name "app-debug.apk" \
            | head -n 1 || true)

          if [ -z "$APK" ]; then
            echo "ERROR: app-debug.apk not found."
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/app-debug.apk"

          echo "=== APK READY ==="
          ls -lh "$GITHUB_WORKSPACE/app-debug.apk"

      - name: Upload app-debug.apk
        uses: actions/upload-artifact@v4
        with:
          name: VILA-AI-V16-debug
          path: app-debug.apk
          if-no-files-found: error
          retention-days: 30
