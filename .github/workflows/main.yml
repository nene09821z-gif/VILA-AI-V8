name: Build VILA V15 APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find V15 ZIP
        shell: bash
        run: |
          ZIP="$(find . -type f -name 'VILA_AI_V15_AI_VIP_ACCOUNT_MEMORY.zip' | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: Không tìm thấy VILA_AI_V15_AI_VIP_ACCOUNT_MEMORY.zip"
            exit 1
          fi

          echo "Found: $ZIP"

          rm -rf vila_source
          mkdir vila_source
          unzip -q "$ZIP" -d vila_source

          ROOT="$(find vila_source -type f -name 'settings.gradle*' -printf '%h\n' | head -n 1)"

          if [ -z "$ROOT" ]; then
            echo "ERROR: Không tìm thấy Android project trong ZIP"
            find vila_source -maxdepth 3 -type f | head -50
            exit 1
          fi

          echo "Android project: $ROOT"

          cp -a "$ROOT"/. .

          echo "Project files:"
          ls -la

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Check Gradle
        run: |
          gradle --version
          test -f settings.gradle || test -f settings.gradle.kts
          test -f app/build.gradle || test -f app/build.gradle.kts

      - name: Build Debug APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Find APK
        run: |
          find app/build/outputs -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VILA-V15-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
