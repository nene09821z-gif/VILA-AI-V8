name: Build VILA AI STUDIO

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Extract source ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="VILA_AI_V54_FULL_SYSTEM.zip"

          if [ -f "$ZIP_FILE" ]; then
            unzip -o -q "$ZIP_FILE"
            rm -f "$ZIP_FILE"
          fi

          echo "=== Source root ==="
          ls -lah

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          yes | sdkmanager --licenses || true

          echo "ANDROID_HOME=$ANDROID_HOME"
          sdkmanager --list_installed

      - name: Find Android project
        id: locate
        shell: bash
        run: |
          set -euo pipefail

          ROOT_FILE="$(find . -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.git/*' \
            -not -path '*/.gradle/*' \
            -not -path '*/build/*' \
            -print -quit)"

          if [ -n "$ROOT_FILE" ]; then
            PROJECT_DIR="$(dirname "$ROOT_FILE")"
          elif [ -f "./gradlew" ]; then
            PROJECT_DIR="."
          else
            echo "::error::Không tìm thấy settings.gradle hoặc gradlew."
            find . -maxdepth 5 -type f | head -200
            exit 1
          fi

          PROJECT_DIR="$(realpath "$PROJECT_DIR")"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

          echo "Android project: $PROJECT_DIR"
          ls -lah "$PROJECT_DIR"

      - name: Verify Gradle Wrapper
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f gradlew ]; then
            echo "::error::Thiếu Gradle Wrapper gradlew."
            exit 1
          fi

          chmod +x gradlew
          ./gradlew --version

      - name: Build Debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon assembleDebug

      - name: Collect APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/output"

          find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/*/*.apk' \
            -exec cp {} "$GITHUB_WORKSPACE/output/" \;

          if ! find "$GITHUB_WORKSPACE/output" \
            -maxdepth 1 -type f -name '*.apk' | grep -q .; then
            echo "::error::Không tìm thấy APK sau khi build."
            exit 1
          fi

          ls -lh "$GITHUB_WORKSPACE/output"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VILA-AI-APK
          path: output/*.apk
          if-no-files-found: error
          retention-days: 7
