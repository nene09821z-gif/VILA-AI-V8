name: VILA Pro V17 - Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: vila-apk-\( {{ github.workflow }}- \){{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: |
          set -euo pipefail
          yes 2>/dev/null | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
          cache-read-only: false

      - name: Show project layout
        run: |
          echo "== repo root =="
          ls -la
          echo "== app =="
          ls -la app || true
          echo "== assets =="
          ls -la app/src/main/assets || true
          echo "== workflows =="
          ls -la .github/workflows || true

      - name: Build debug APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2g"
        run: |
          set -euo pipefail
          gradle assembleDebug --no-daemon --stacktrace --info | tee build.log

      - name: Locate APK
        id: apk
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk -type f -name "*.apk" | head -n 1 || true)
          if [ -z "${APK}" ]; then
            echo "::error::Không tìm thấy file APK sau khi build"
            find app/build -type f 2>/dev/null | head -n 80 || true
            exit 1
          fi
          echo "path=${APK}" >> "$GITHUB_OUTPUT"
          echo "name=\( (basename " \){APK}")" >> "$GITHUB_OUTPUT"
          ls -lh "${APK}"
          echo "APK_PATH=${APK}" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VILA-Pro-V17-debug
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: VILA-Pro-V17-build-log
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
