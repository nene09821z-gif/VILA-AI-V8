
name: VILA AI - Build APK and ZIP

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Repository files ==="
          ls -la

          FILE=$(find . -maxdepth 8 -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path '*/.git/*' \
            -not -path '*/.gradle/*' \
            | head -n 1 || true)

          if [ -n "$FILE" ]; then
            ROOT="$(dirname "$FILE")"
          else
            FILE=$(find . -maxdepth 8 -type f \
              \( -path '*/app/build.gradle' \
                 -o -path '*/app/build.gradle.kts' \) \
              -not -path '*/.git/*' \
              -not -path '*/.gradle/*' \
              | head -n 1 || true)

            if [ -n "$FILE" ]; then
              ROOT="$(dirname "$(dirname "$FILE")")"
            else
              echo "::error::Không tìm thấy dự án Android."
              find . -maxdepth 8 -type f \
                \( -name settings.gradle \
                   -o -name settings.gradle.kts \
                   -o -name build.gradle \
                   -o -name build.gradle.kts \)
              exit 1
            fi
          fi

          echo "dir=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Android project root: $ROOT"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Configure Android SDK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8"
        run: |
          set -euo pipefail
          gradle assembleDebug --no-daemon --stacktrace

          APK=$(find app/build/outputs/apk/debug \
            -maxdepth 1 -type f -name '*.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "::error::Build xong nhưng không tìm thấy APK."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK" "$GITHUB_WORKSPACE/output/VILA-AI-debug.apk"

      - name: Package source ZIP
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail
          mkdir -p output
          zip -qr output/VILA-AI-source.zip "$PROJECT_DIR" \
            -x '*/.git/*' \
               '*/.gradle/*' \
               '*/build/*' \
               '*/local.properties' \
               '*/.idea/*' \
               '*.apk' '*.aab'

      - name: Create complete ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/VILA-AI-package
          cp output/VILA-AI-debug.apk output/VILA-AI-package/
          cp output/VILA-AI-source.zip output/VILA-AI-package/

          cat > output/VILA-AI-package/README.txt <<'EOF'
          VILA AI BUILD PACKAGE
          VILA-AI-debug.apk: Android debug APK.
          VILA-AI-source.zip: Android project source code.
          EOF

          cd output
          zip -qr VILA-AI-complete.zip VILA-AI-package

      - name: Upload APK and ZIP artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VILA-AI-Build-Files
          path: |
            output/VILA-AI-debug.apk
            output/VILA-AI-source.zip
            output/VILA-AI-complete.zip
          if-no-files-found: error
          retention-days: 30
          
