name: VILA V15 - Build APK

on:
  push:
    branches: [ main, master ]

  pull_request:
    branches: [ main, master ]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build VILA APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Check JavaScript
        shell: bash
        run: |
          set -e

          found=0

          while IFS= read -r file; do
            found=1
            echo "Checking $file"
            node --check "$file"
          done < <(
            find app/src/main/assets \
              -type f \
              -name '*.js' \
              -print
          )

          if [ "$found" -eq 0 ]; then
            echo "No local JavaScript files to check."
          fi

      - name: Build Debug APK
        run: |
          ./gradlew \
            clean \
            assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          test -n "$(
            find app/build/outputs/apk/debug \
              -type f \
              -name '*.apk' \
              -print \
              -quit
          )"

          find app/build/outputs/apk/debug \
            -type f \
            -name '*.apk' \
            -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VILA-V15-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
