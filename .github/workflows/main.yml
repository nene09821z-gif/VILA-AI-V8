name: VILA AI V24 - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Cài đặt SDK 34 để khớp với cấu hình compileSdk 34 của dự án
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0"

      - name: Find Android project
        id: project
        shell: bash
        run: |
          set -e

          if [ -f "settings.gradle" ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -f "VILA_AI_V9_Android/settings.gradle" ]; then
            echo "dir=VILA_AI_V9_Android" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Không tìm thấy settings.gradle"
          find . -maxdepth 4 \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -print

          exit 1

      # BƯỚC QUAN TRỌNG: Chặn đứng lỗi Kotlin
      - name: Verify project (No Kotlin Allowed)
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -e

          echo "===== PROJECT ====="
          pwd

          echo "===== FILES ====="
          find app/src/main/java -type f -maxdepth 10 -print || true

          echo "===== CHECK KOTLIN ====="

          if find app/src/main -type f \
            \( -name "*.kt" -o -name "*.kts" \) \
            | grep -q .; then

            echo "::error::Phát hiện file Kotlin (.kt/.kts). Project V24 phải dùng Java thuần."
            find app/src/main \
              \( -name "*.kt" -o -name "*.kts" \) \
              -print

            exit 1
          fi

          echo "OK: Không có file Kotlin nào."
          
          # Kiểm tra xem file MainActivity.java có tồn tại không
          if [ -f "app/src/main/java/com/vila/ai/MainActivity.java" ]; then
             echo "OK: MainActivity.java tồn tại"
          else
             echo "::warning::Không tìm thấy MainActivity.java tại đường dẫn mặc định, nhưng vẫn tiếp tục build..."
          fi

      - name: Write local.properties
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          cat local.properties

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Clean
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          gradle clean --no-daemon

      - name: Build Debug APK
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.daemon=false
            -Dorg.gradle.jvmargs=-Xmx2g
            -Dfile.encoding=UTF-8
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Locate APK
        id: apk
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          set -e

          APK=$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "::error::Không tìm thấy APK"
            exit 1
          fi

          echo "APK: $APK"

          cp "$APK" \
            "$GITHUB_WORKSPACE/VILA-AI-V24-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VILA-AI-V24-debug
          path: VILA-AI-V24-debug.apk
          if-no-files-found: error
          retention-days: 30
