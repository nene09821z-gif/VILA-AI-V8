name: VILA Pro V17.5.0 - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: vila-pro-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "17"
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "35"
  BUILD_TOOLS: "35.0.0"

jobs:
  build:
    name: Build VILA Pro V17.5.0
    runs-on: ubuntu-latest

    steps:

      # ============================================
      # 1. CHECKOUT
      # ============================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================
      # 2. JAVA 17
      # ============================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Verify Java
        shell: bash
        run: |
          set -euo pipefail

          java -version
          javac -version

          JAVA_MAJOR=$(java -version 2>&1 \
            | sed -n 's/.*version "\([0-9]*\).*/\1/p' \
            | head -n 1)

          if [ "$JAVA_MAJOR" != "17" ]; then
            echo "::error::Java 17 is required."
            exit 1
          fi

      # ============================================
      # 3. GRADLE
      # ============================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Verify Gradle
        shell: bash
        run: |
          set -euo pipefail
          gradle --version

      # ============================================
      # 4. ANDROID SDK
      # ============================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -euo pipefail

          test -d "$ANDROID_HOME/platforms/android-${ANDROID_API}"
          test -d "$ANDROID_HOME/build-tools/${BUILD_TOOLS}"

          echo "Android API ${ANDROID_API}: OK"
          echo "Build Tools ${BUILD_TOOLS}: OK"

      # ============================================
      # 5. FIND ANDROID PROJECT
      # ============================================
      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for Android project..."

          SETTINGS_FILE=$(
            find . \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -not -path "./.git/*" \
              | head -n 1
          )

          # ----------------------------------------
          # Project already extracted
          # ----------------------------------------
          if [ -n "$SETTINGS_FILE" ]; then

            PROJECT_DIR=$(dirname "$SETTINGS_FILE")

            echo "Found Android project:"
            echo "$PROJECT_DIR"

          # ----------------------------------------
          # Project is inside ZIP
          # ----------------------------------------
          else

            echo "settings.gradle not found."
            echo "Searching for ZIP archive..."

            ZIP_FILE=$(
              find . \
                -type f \
                -iname "*.zip" \
                -not -path "./.git/*" \
                | head -n 1
            )

            if [ -z "$ZIP_FILE" ]; then
              echo "::error::No Android project or ZIP archive found."

              echo "Repository files:"
              find . -maxdepth 5 -type f | sort

              exit 1
            fi

            echo "ZIP found:"
            echo "$ZIP_FILE"

            rm -rf .vila_extract
            mkdir -p .vila_extract

            unzip -q "$ZIP_FILE" -d .vila_extract

            SETTINGS_FILE=$(
              find .vila_extract \
                -type f \
                \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
                | head -n 1
            )

            if [ -z "$SETTINGS_FILE" ]; then
              echo "::error::settings.gradle was not found after ZIP extraction."

              echo "Extracted files:"
              find .vila_extract -maxdepth 7 -type f | sort

              exit 1
            fi

            PROJECT_DIR=$(dirname "$SETTINGS_FILE")

          fi

          PROJECT_DIR=$(cd "$PROJECT_DIR" && pwd)

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "================================"
          echo "ANDROID PROJECT"
          echo "$PROJECT_DIR"
          echo "================================"

      # ============================================
      # 6. VERIFY PROJECT STRUCTURE
      # ============================================
      - name: Verify Android project
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking:"
          echo "$PROJECT_DIR"

          test -f "$PROJECT_DIR/settings.gradle" \
            || test -f "$PROJECT_DIR/settings.gradle.kts"

          test -f "$PROJECT_DIR/build.gradle" \
            || test -f "$PROJECT_DIR/build.gradle.kts"

          test -f "$PROJECT_DIR/app/build.gradle" \
            || test -f "$PROJECT_DIR/app/build.gradle.kts"

          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          test -f "$PROJECT_DIR/app/src/main/assets/index.html"

          echo "Android project structure: OK"

      # ============================================
      # 7. VERIFY VILA V17.5
      # ============================================
      - name: Verify VILA configuration
        shell: bash
        run: |
          set -euo pipefail

          APP="$PROJECT_DIR/app"

          echo "Checking compileSdk..."

          grep -q "compileSdk 35" \
            "$APP/build.gradle"

          echo "Checking version..."

          grep -q "versionName '17.5.0'" \
            "$APP/build.gradle"

          echo "Checking Groq model..."

          grep -Rqi "openai/gpt-oss-120b" \
            "$APP/src/main"

          echo "Checking Gemini..."

          grep -Rqi "gemini" \
            "$APP/src/main"

          echo "Checking GitHub..."

          grep -Rqi "github" \
            "$APP/src/main"

          echo "Checking VILA Server / enpoiko..."

          if grep -RqiE \
            "enpoiko|vila_server_url|VILA Server" \
            "$APP/src/main"; then

            echo "enpoiko: FOUND"

          else

            echo "::warning::enpoiko was not detected by text search."

          fi

          echo "VILA V17.5 configuration: OK"

      # ============================================
      # 8. BUILD APK
      # ============================================
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Starting Gradle build..."

          gradle clean :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # ============================================
      # 9. VERIFY APK
      # ============================================
      - name: Verify generated APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "::error::APK was not generated."

            find "$PROJECT_DIR/app/build/outputs" \
              -type f \
              2>/dev/null || true

            exit 1
          fi

          if [ ! -s "$APK" ]; then
            echo "::error::APK is empty."
            exit 1
          fi

          mkdir -p artifacts

          cp "$APK" \
            "artifacts/VILA-Pro-V17.5.0-debug.apk"

          echo "================================"
          echo "APK BUILD SUCCESS"
          echo "================================"

          ls -lh \
            "artifacts/VILA-Pro-V17.5.0-debug.apk"

          echo "SHA256:"
          sha256sum \
            "artifacts/VILA-Pro-V17.5.0-debug.apk"

      # ============================================
      # 10. UPLOAD APK
      # ============================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VILA-Pro-V17.5.0-debug
          path: artifacts/VILA-Pro-V17.5.0-debug.apk
          if-no-files-found: error
          retention-days: 30
