
name: Chess Bot Android APK — WORKFLOW FIX V4

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: chess-bot-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: VERIFY ACTIVE WORKFLOW — V6
        shell: bash
        run: |
          set -euo pipefail
          echo "WORKFLOW_REVISION=chess-android-v4-2026-10-16"
          echo "APK integrity verification enabled"

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Locate and safely extract Chess Bot source ZIP
        id: source
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$GITHUB_WORKSPACE/VILA_CHESS_V3_25_RUN_TEST_FIXED.zip"

          if [[ ! -s "$ZIP_FILE" ]]; then
            echo "::error::Source ZIP missing or empty: $ZIP_FILE"
            exit 1
          fi

          python3 - <<'PY'
          import os
          import pathlib
          import zipfile

          archive = (
              pathlib.Path(os.environ["GITHUB_WORKSPACE"])
              / "VILA_CHESS_V3_25_RUN_TEST_FIXED.zip"
          )
          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "chess-bot-source"
          out.mkdir(parents=True, exist_ok=True)

          with zipfile.ZipFile(archive) as zf:
              entries = zf.infolist()

              if len(entries) > 12000:
                  raise SystemExit("ZIP rejected: too many entries")

              if sum(e.file_size for e in entries) > 700 * 1024 * 1024:
                  raise SystemExit("ZIP rejected: expanded size exceeds 700 MB")

              bad = zf.testzip()
              if bad:
                  raise SystemExit(f"Corrupt ZIP entry: {bad}")

              for entry in entries:
                  path = pathlib.PurePosixPath(entry.filename)
                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"Unsafe ZIP path: {entry.filename}")

              zf.extractall(out)

          candidates = [
              p for p in out.rglob("package.json")
              if "node_modules" not in p.parts
          ]

          candidates = [
              p for p in candidates
              if (p.parent / "capacitor.config.json").is_file()
          ]

          if not candidates:
              raise SystemExit(
                  "No valid Capacitor project found in source ZIP"
              )

          candidates.sort(key=lambda p: (len(p.parts), str(p)))
          shallowest = len(candidates[0].parts)
          roots = [p for p in candidates if len(p.parts) == shallowest]

          if len(roots) != 1:
              raise SystemExit(
                  "Ambiguous project roots in source ZIP: "
                  + ", ".join(str(p.parent) for p in roots)
              )

          project = roots[0].parent

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"project_dir={project}\n")

          print(f"Using project: {project}")
          PY

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Node dependencies
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: npm install --no-audit --no-fund

      - name: Check source syntax
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          node --check src/main.js
          node --check server/index.js
          node --check scripts/copy-engine.mjs
          node --check scripts/apply-android-branding.mjs
          node --check scripts/verify-android-project.mjs
          python3 -m py_compile scripts/package-android-source.py

      - name: Run tests
        working-directory: ${{ steps.source.outputs.project_dir }}
        run: npm test

      - name: Build web assets
        working-directory: ${{ steps.source.outputs.project_dir }}
        env:
          REQUIRE_STOCKFISH: "1"
        run: npm run build

      - name: Generate and sync Android project
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f android/settings.gradle && ! -f android/settings.gradle.kts ]]; then
            npx cap add android
          fi

          npx cap sync android
          node scripts/apply-android-branding.mjs
          node scripts/verify-android-project.mjs

      - name: Build debug APK
        working-directory: ${{ steps.source.outputs.project_dir }}/android
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Verify APK integrity and package contents
        id: apk
        working-directory: ${{ steps.source.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail

          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [[ ! -s "$APK" ]]; then
            echo "::error::APK missing or empty: $APK"
            find android/app/build/outputs -maxdepth 5 -type f -print || true
            exit 1
          fi

          command -v unzip >/dev/null || {
            echo "::error::unzip is unavailable"
            exit 1
          }

          unzip -t "$APK"

          python3 - "$APK" <<'PY'
          import pathlib
          import sys
          import zipfile

          apk = pathlib.Path(sys.argv[1])

          if not zipfile.is_zipfile(apk):
              raise SystemExit("APK is not a valid ZIP-based Android package")

          with zipfile.ZipFile(apk) as zf:
              bad = zf.testzip()
              if bad:
                  raise SystemExit(f"Corrupt APK entry: {bad}")

              names = set(zf.namelist())

              if "AndroidManifest.xml" not in names:
                  raise SystemExit("APK is missing AndroidManifest.xml")

              dex_files = [
                  name for name in names
                  if name == "classes.dex"
                  or (
                      name.startswith("classes")
                      and name.endswith(".dex")
                      and name[7:-4].isdigit()
                  )
              ]

              if not dex_files:
                  raise SystemExit("APK contains no DEX bytecode")

              print("APK ZIP integrity: PASS")
              print("Android manifest: PASS")
              print("DEX files:", ", ".join(sorted(dex_files)))
          PY

          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK" "$GITHUB_WORKSPACE/output/Chess-Bot-debug.apk"

          cmp "$APK" "$GITHUB_WORKSPACE/output/Chess-Bot-debug.apk"

          sha256sum "$GITHUB_WORKSPACE/output/Chess-Bot-debug.apk" \
            | tee "$GITHUB_WORKSPACE/output/SHA256SUMS.txt"

          ls -lh "$GITHUB_WORKSPACE/output"

      - name: Upload verified APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chess-Bot-debug-APK-An
          path: output/*
          if-no-files-found: error
          retention-days: 14
          
