name: Build VILA APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Cài đặt Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Chấp nhận giấy phép SDK
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # 1. Tìm và giải nén file ZIP (hỗ trợ mọi tên file zip)
      - name: Giải nén file ZIP dự án
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -1)
          if [ -z "$ZIP_FILE" ]; then
            echo "❌ Không tìm thấy file ZIP nào trên GitHub!"
            exit 1
          fi
          echo "Đã tìm thấy file: $ZIP_FILE"
          mkdir -p project_src
          unzip -q "$ZIP_FILE" -d project_src
          echo "Đã giải nén xong."
          ls -la project_src

      # 2. Tìm thư mục chứa settings.gradle và build
      - name: Build APK
        run: |
          cd project_src
          
          # Tìm file settings.gradle
          SETTINGS_FILE=$(find . -maxdepth 3 \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)
          
          if [ -n "$SETTINGS_FILE" ]; then
            DIR=$(dirname "$SETTINGS_FILE")
            echo "Đã tìm thấy settings.gradle tại: $DIR"
            cd "$DIR"
          else
            echo "⚠️ Không tìm thấy settings.gradle, thử build ở thư mục gốc..."
          fi
          
          echo "Đang build tại thư mục: $(pwd)"
          
          # Tự động tạo gradlew nếu thiếu
          if [ ! -f "./gradlew" ]; then
            echo "Không tìm thấy gradlew, đang tự tạo..."
            gradle wrapper
          fi
          
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Tải lên APK
        uses: actions/upload-artifact@v4
        with:
          name: VILA-APK
          path: 'project_src/**/build/outputs/apk/debug/*.apk'
          if-no-files-found: error
