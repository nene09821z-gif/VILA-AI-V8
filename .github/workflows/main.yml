name: VILA SmartCoder

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  validate:
    name: Check JavaScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Find JavaScript files
        run: |
          find . -type f -name "*.js" \
            ! -path "./node_modules/*" \
            -print

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -e

          FAILED=0

          while IFS= read -r file; do
            echo "Checking: $file"

            if ! node --check "$file"; then
              echo "Syntax error: $file"
              FAILED=1
            fi
          done < <(
            find . -type f -name "*.js" \
              ! -path "./node_modules/*"
          )

          if [ "$FAILED" -ne 0 ]; then
            echo "JavaScript syntax check failed."
            exit 1
          fi

          echo "All JavaScript files passed."

      - name: Check HTML
        run: |
          test -f assets/index.html
          echo "index.html found."

      - name: Package source
        run: |
          mkdir -p build

          zip -r build/VILA-V15-SmartCoder-source.zip . \
            -x ".git/*" \
            -x "build/*" \
            -x "node_modules/*"

      - name: Upload source
        uses: actions/upload-artifact@v4
        with:
          name: VILA-V15-SmartCoder-source
          path: build/VILA-V15-SmartCoder-source.zip
