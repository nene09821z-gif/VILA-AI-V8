name: VILA Pro V17.2.1 - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: vila-pro-${{ github.ref }}
  cancel-in-progress: true

env:
  PROJECT_DIR: VILA_AI_V9_Android
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "35"
  BUILD_TOOLS: "35.0.0"

jobs:
  build:
    name: Build VILA Pro 17.2.1
    runs-on: ubuntu-latest

    steps:
      # ==============================
      # 1. Checkout
      # ==============================
      - name: Checkout
        uses: actions/checkout@v4

      # ==============================
      # 2. Java 17
      # ==============================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ==============================
      # 3. Verify Java
      # ==============================
      - name: Verify Java
        shell: bash
        run: |
          set -e

          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version

          java -version 2>&1 | grep -q '"17\.' || {
            echo "::error::Java 17 is not active."
            exit 1
          }

      # ==============================
      # 4. Setup Gradle
      # ==============================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      # ==============================
      # 5. Android SDK
      # ==============================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-${ANDROID_API}" \
            "build-tools;${BUILD_TOOLS}"

      # ==============================
      # 6. Verify project
      # ==============================
      - name: Verify project
        shell: bash
        run: |
          set -e

          test -d "$PROJECT_DIR"
          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"

          echo "Android project OK."

      # ==============================
      # 7. Verify VILA
      # ==============================
      - name: Verify VILA Pro 17.2.1
        shell: bash
        run: |
          set -e

          MAIN="$PROJECT_DIR/app/src/main"

          test -f "$MAIN/AndroidManifest.xml"
          test -f "$MAIN/assets/index.html"
          test -f "$MAIN/java/com/vila/ai/MainActivity.java"

          grep -q "17.2.1" \
            "$PROJECT_DIR/app/build.gradle"

          grep -q "openai/gpt-oss-120b" \
            "$MAIN/assets/index.html"

          grep -qi "gemini" \
            "$MAIN/assets/index.html"

          grep -qi "github" \
            "$MAIN/assets/index.html"

          echo "VILA verification OK."

      # ==============================
      # 8. Build
      # ==============================
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          set -e

          gradle clean :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # ==============================
      # 9. Verify APK
      # ==============================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"

          test -s "$APK"

          mkdir -p artifacts

          cp "$APK" \
            "artifacts/VILA-Pro-V17.2.1-debug.apk"

          echo "APK:"
          ls -lh artifacts/VILA-Pro-V17.2.1-debug.apk

          echo "SHA256:"
          sha256sum artifacts/VILA-Pro-V17.2.1-debug.apk

      # ==============================
      # 10. Upload
      # ==============================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VILA-Pro-V17.2.1-debug
          path: artifacts/VILA-Pro-V17.2.1-debug.apk
          if-no-files-found: error
          retention-days: 30
