name: VILA Pro V17 - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  GRADLE_VERSION: "8.11.1"
  PROJECT_DIR: "VILA_AI_V9_Android"

jobs:
  build:
    name: Build app-debug.apk
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Extract VILA ZIP when needed
        shell: bash
        run: |
          set -e

          if [ -d "$PROJECT_DIR" ]; then
            echo "VILA project already exists."
            exit 0
          fi

          ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' \
            ! -path './.git/*' \
            | head -n 1 || true)"

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: VILA_AI_V9_Android folder and ZIP were not found."
            exit 1
          fi

          echo "ZIP found: $ZIP_FILE"

          mkdir -p .vila_extract
          unzip -q -o "$ZIP_FILE" -d .vila_extract

          FOUND="$(find .vila_extract -type d \
            -name 'VILA_AI_V9_Android' \
            -print -quit || true)"

          if [ -z "$FOUND" ]; then
            echo "ERROR: VILA_AI_V9_Android was not found after extraction."
            exit 1
          fi

          rm -rf "$PROJECT_DIR"
          cp -a "$FOUND" "$PROJECT_DIR"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"

          if [ -z "$SDK" ]; then
            echo "ERROR: Android SDK path is not available."
            exit 1
          fi

          echo "Android SDK: $SDK"

          test -d "$SDK/platforms/android-35"
          test -d "$SDK/build-tools/35.0.0"

          echo "Android SDK 35 is ready."

      - name: Build app-debug.apk
        working-directory: VILA_AI_V9_Android
        shell: bash
        run: |
          set -e

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Copy APK
        shell: bash
        run: |
          set -e

          APK="VILA_AI_V9_Android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: app-debug.apk was not generated."
            find VILA_AI_V9_Android/app/build/outputs \
              -type f -name "*.apk" 2>/dev/null || true
            exit 1
          fi

          cp "$APK" app-debug.apk

          ls -lh app-debug.apk

      - name: Upload app-debug.apk
        uses: actions/upload-artifact@v4
        with:
          name: VILA-Pro-V17-debug
          path: app-debug.apk
          if-no-files-found: error
          retention-days: 30
