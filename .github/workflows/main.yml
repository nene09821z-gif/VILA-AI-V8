name: VILA-BUILD

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          ZIP=$(find . -type f -name "*.zip" | head -1)
          mkdir vila
          unzip -o "$ZIP" -d vila

      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        run: |
          cd vila
          gradle assembleDebug

      - name: APK
        uses: actions/upload-artifact@v4
        with:
          name: VILA-APK
          path: vila/**/build/outputs/apk/debug/*.apk
