name: Build VILA Con

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # Tăng nhẹ thời gian timeout để đề phòng build lâu

    steps:
      # 1. Lấy mã nguồn từ GitHub
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 2. Giải nén ZIP VILA AI
      - name: Extract VILA AI source ZIP
        shell: bash
        run: |
          set -euo pipefail
          
          ZIP_FILE="VILA_AI_V70_BUILD_SECURITY.zip"
          
          if [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Không tìm thấy $ZIP_FILE ở thư mục gốc repository."
            echo "Hãy tải ZIP lên GitHub cùng cấp với thư mục .github."
            exit 1
          fi
          
          mkdir -p "$RUNNER_TEMP/vila-source"
          unzip -o -q "$ZIP_FILE" -d "$RUNNER_TEMP/vila-source"
          cp -a "$RUNNER_TEMP/vila-source/." "$GITHUB_WORKSPACE/"
          
          echo "=== Files after extraction ==="
          ls -lah

      # 3. Cài Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 4. Cài đặt Android SDK (Sử dụng Action chính thức để ổn định hơn)
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -euo pipefail
          echo "=== Đang cài đặt các gói SDK ==="
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0"
            
          echo "=== Các gói SDK đã cài đặt ==="
          sdkmanager --list_installed

      # 5. Tìm dự án Android
      - name: Find Android project
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          WRAPPER="$(find "$GITHUB_WORKSPACE" -type f \
            -name gradlew \
            -not -path '*/.git/*' \
            -not -path '*/.gradle/*' \
            -not -path '*/build/*' \
            -print -quit)"
            
          if [ -n "$WRAPPER" ]; then
            PROJECT_DIR="$(dirname "$WRAPPER")"
          else
            ROOT_FILE="$(find "$GITHUB_WORKSPACE" -type f \
              \( -name settings.gradle -o -name settings.gradle.kts \) \
              -not -path '*/.git/*' \
              -not -path '*/.gradle/*' \
              -not -path '*/build/*' \
              -print -quit)"
            if [ -n "$ROOT_FILE" ]; then
              PROJECT_DIR="$(dirname "$ROOT_FILE")"
            else
              echo "::error::Không tìm thấy gradlew hoặc settings.gradle."
              find "$GITHUB_WORKSPACE" -maxdepth 6 -type f | head -200
              exit 1
            fi
          fi
          
          PROJECT_DIR="$(realpath "$PROJECT_DIR")"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "=== Android project ==="
          echo "$PROJECT_DIR"
          ls -lah "$PROJECT_DIR"

      # 6. Cài đặt Gradle (Đảm bảo lệnh 'gradle' có sẵn trên runner)
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.2' # Chỉ định phiên bản Gradle phù hợp với dự án của bạn

      # 7. Kiểm tra và tự động tạo Gradle Wrapper nếu bị thiếu
      - name: Verify and Create Gradle Wrapper
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set -euo pipefail
          WRAPPER_JAR="./gradle/wrapper/gradle-wrapper.jar"
          
          if [ ! -f "./gradlew" ] || [ ! -f "$WRAPPER_JAR" ]; then
            echo "::warning::Dự án thiếu Gradle Wrapper (gradlew hoặc gradle-wrapper.jar). Đang tiến hành tạo tự động..."
            # Lệnh này sẽ tạo lại cả gradlew, gradle-wrapper.jar và gradle-wrapper.properties
            gradle wrapper
          fi
          
          chmod +x ./gradlew
          ./gradlew --version

      # 8. BUILD APK DEBUG (Có cơ chế bắt và lọc lỗi thông minh)
      - name: Build Debug APK
        working-directory: ${{ steps.locate.outputs.project_dir }}
        shell: bash
        run: |
          set +e 
          echo "Bắt đầu build APK Debug..."
          
          ./gradlew --no-daemon --stacktrace --warning-mode all assembleDebug > build_full.log 2>&1
          BUILD_STATUS=$?
          
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "====================================================="
            echo "::error::BUILD THẤT BẠI. ĐANG TRÍCH XUẤT THÔNG TIN LỖI..."
            echo "====================================================="
            
            echo "--- 100 dòng trước và 150 dòng sau dòng FAILURE ---"
            grep -n -A 150 -B 100 "FAILURE: Build failed" build_full.log || true
            
            echo "--- Các dòng lỗi biên dịch (error, e:, Caused by) ---"
            grep -n -E "error:|e: |Caused by:|What went wrong" build_full.log || true
            
            echo "====================================================="
            exit 1
          else
            echo "Build thành công!"
          fi

      # 9. Tìm và kiểm tra APK
      - name: Collect APK
        id: collect
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.locate.outputs.project_dir }}
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/output"
          
          find "$PROJECT_DIR" -type f \
            -path '*/build/outputs/apk/*/*.apk' \
            -not -path '*/androidTest/*' \
            -exec cp {} "$GITHUB_WORKSPACE/output/" \;
            
          APK_COUNT="$(find "$GITHUB_WORKSPACE/output" \
            -maxdepth 1 -type f -name '*.apk' | wc -l)"
            
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "::error::Build không tạo được APK."
            exit 1
          fi
          
          echo "=== APK output ==="
          ls -lh "$GITHUB_WORKSPACE/output"

      # 10. Upload APK để tải về
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VILA-AI-APK
          path: output/*.apk
          if-no-files-found: error
          retention-days: 7
