name: VILA Pro V17.2.1 - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: vila-pro-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: "8.11.1"
  ANDROID_API: "35"
  BUILD_TOOLS: "35.0.0"

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools"

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -e
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -f "$SDKMANAGER" ]; then
            SDKMANAGER="sdkmanager"
          fi
          yes | $SDKMANAGER --licenses || true
          $SDKMANAGER "platforms;android-${ANDROID_API}" "build-tools;${BUILD_TOOLS}"

      - name: Locate Android project
        shell: bash
        run: |
          set -e
          # Tìm thư mục chứa settings.gradle
          PROJECT_DIR="$(find . -maxdepth 4 \( -name "settings.gradle" -o -name "settings.gradle.kts" \) -not -path '*/build/*' | head -n 1 | xargs -r dirname)"

          # Nếu không tìm thấy, tìm thư mục chứa build.gradle
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="$(find . -maxdepth 4 \( -name "build.gradle" -o -name "build.gradle.kts" \) -not -path '*/build/*' | head -n 1 | xargs -r dirname)"
          fi

          # Mặc định lấy thư mục gốc nếu không phát hiện được file cấu hình
          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="."
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Found Android project at: $PROJECT_DIR"

      - name: Verify Android project
        shell: bash
        run: |
          set -e
          MANIFEST_FILE="$(find . -name "AndroidManifest.xml" -not -path '*/build/*' | head -n 1)"
          if [ -z "$MANIFEST_FILE" ]; then
            echo "::warning::Chưa tìm thấy AndroidManifest.xml, vẫn tiếp tục thử lệnh build..."
          else
            echo "Found AndroidManifest.xml at: $MANIFEST_FILE"
          fi

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          if [ -f "./gradlew" ]; then
            chmod +x gradlew
            ./gradlew clean :app:assembleDebug --no-daemon --stacktrace
          else
            gradle clean :app:assembleDebug --no-daemon --stacktrace
          fi

      - name: Verify APK
        shell: bash
        run: |
          set -e
          APK="$(find "$PROJECT_DIR" -name "*.apk" -path "*/outputs/apk/*" | head -n 1)"

          if [ -z "$APK" ] || [ ! -s "$APK" ]; then
            echo "::error::Khong tim thấy file APK được tạo ra sau khi build."
            exit 1
          fi

          mkdir -p artifacts
          cp "$APK" "artifacts/VILA-Pro-V17.2.1-debug.apk"

          echo "APK generated successfully:"
          ls -lh artifacts/VILA-Pro-V17.2.1-debug.apk
          sha256sum artifacts/VILA-Pro-V17.2.1-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VILA-Pro-V17.2.1-debug
          path: artifacts/VILA-Pro-V17.2.1-debug.apk
          if-no-files-found: error
          retention-days: 30
          
