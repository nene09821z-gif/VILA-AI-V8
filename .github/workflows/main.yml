name: VILA Pro Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Find and extract ZIP
        run: |
          set -e
          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" | head -1)
          if [ -n "$ZIP" ]; then
            mkdir -p build_src
            unzip -q "$ZIP" -d build_src
            echo "Đã giải nén $ZIP vào build_src"
          else
            echo "Không tìm thấy file ZIP, copy trực tiếp..."
            mkdir -p build_src
            cp -r ./* build_src/ 2>/dev/null || true
          fi
          ls -la build_src

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ĐÃ XÓA BƯỚC SETUP ANDROID SDK BỊ LỖI Ở ĐÂY

      - name: Build
        working-directory: build_src
        run: |
          # Tìm thư mục chứa settings.gradle nếu nó bị lồng
          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            echo "Project ở gốc build_src"
          else
            echo "Đang tìm settings.gradle..."
            DIR=$(find . -maxdepth 3 \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1 | xargs dirname)
            if [ -n "$DIR" ]; then
              echo "Chuyển vào thư mục: $DIR"
              cd "$DIR"
            fi
          fi
          
          chmod +x gradlew 2>/dev/null || true
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VILA-Pro-APK
          path: build_src/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
