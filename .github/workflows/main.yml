name: Build VILA APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract VILA V12 ZIP
        run: |
          ZIP=$(find . -type f -name 'VILA_AI_V12_ANDROID_COMPACT_VILA_IMAGE_ICON.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "Khong tim thay VILA V12 ZIP"
            exit 1
          fi

          mkdir -p vila_source
          unzip -q "$ZIP" -d vila_source

          ROOT=$(find vila_source -type f -name 'settings.gradle*' -printf '%h\n' | head -n 1)

          if [ -z "$ROOT" ]; then
            echo "Khong tim thay Android project"
            exit 1
          fi

          cp -a "$ROOT"/. .

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VILA-V12-APK
          path: app/build/outputs/apk/debug/app-debug.apk
