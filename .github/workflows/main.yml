name: VILA V15 Gemini Enhanced

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build VILA V15 APK
    runs-on: ubuntu-latest

    steps:

      # =========================
      # Checkout
      # =========================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================
      # Java 17
      # =========================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # =========================
      # Node.js
      # =========================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # =========================
      # Gradle
      # =========================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # =========================
      # Tìm và giải nén VILA ZIP
      # =========================
      - name: Extract VILA project
        shell: bash
        run: |
          set -e

          mkdir -p vila-project

          ZIP=$(find . \
            -maxdepth 3 \
            -type f \
            -name 'VILA-V15-Gemini-Enhanced-GitHub.zip' \
            -print \
            -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: VILA project ZIP not found."
            echo
            echo "ZIP files available:"
            find . -type f -name '*.zip' -print
            exit 1
          fi

          echo "Using:"
          echo "$ZIP"

          unzip -q "$ZIP" -d vila-project

          echo
          echo "Extracted project:"
          find vila-project -maxdepth 4 -type f | sort

      # =========================
      # Kiểm tra Gradle project
      # =========================
      - name: Find Android project
        shell: bash
        run: |
          set -e

          PROJECT=$(find vila-project \
            -type f \
            -name 'settings.gradle' \
            -print \
            -quit)

          if [ -z "$PROJECT" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          ROOT=$(dirname "$PROJECT")

          echo "Android project:"
          echo "$ROOT"

          test -f "$ROOT/build.gradle"
          test -f "$ROOT/app/build.gradle"
          test -f "$ROOT/app/src/main/AndroidManifest.xml"
          test -f "$ROOT/app/src/main/assets/index.html"

          echo "Android project OK."

          echo "$ROOT" > /tmp/vila_root

      # =========================
      # Kiểm tra JavaScript
      # =========================
      - name: Check VILA JavaScript
        shell: bash
        run: |
          set -e

          ROOT=$(cat /tmp/vila_root)

          echo "Checking:"
          echo "$ROOT"

          FOUND=0

          while IFS= read -r file; do
            FOUND=1

            echo "Checking JS:"
            echo "$file"

            node --check "$file"

          done < <(
            find "$ROOT/app/src/main/assets" \
              -type f \
              -name '*.js' \
              -print
          )

          if [ "$FOUND" -eq 0 ]; then
            echo "No external JS files found."
          fi

      # =========================
      # Kiểm tra server
      # =========================
      - name: Check server
        shell: bash
        run: |
          set -e

          ROOT=$(cat /tmp/vila_root)

          if [ -f "$ROOT/server/server.js" ]; then
            node --check "$ROOT/server/server.js"
            echo "server.js OK."
          else
            echo "No server.js. Skipping."
          fi

      # =========================
      # Build APK
      # =========================
      - name: Build APK
        shell: bash
        run: |
          set -e

          ROOT=$(cat /tmp/vila_root)

          cd "$ROOT"

          echo "===== PROJECT ====="
          pwd

          echo
          echo "===== GRADLE ====="
          gradle --version

          echo
          echo "===== BUILD ====="

          gradle \
            clean \
            assembleDebug \
            --stacktrace \
            --no-daemon

      # =========================
      # Kiểm tra APK
      # =========================
      - name: Verify APK
        shell: bash
        run: |
          set -e

          ROOT=$(cat /tmp/vila_root)

          APK="$ROOT/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK not found."

            find "$ROOT/app/build/outputs" \
              -type f \
              -print \
              || true

            exit 1
          fi

          echo
          echo "================================"
          echo "VILA APK BUILD SUCCESS"
          echo "================================"

          ls -lh "$APK"

      # =========================
      # Upload APK
      # =========================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VILA-V15-Gemini-Enhanced
          path: vila-project/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
