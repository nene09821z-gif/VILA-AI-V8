name: VILA AI - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Find or extract project
        shell: bash
        run: |
          set -e

          settings=$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) ! -path './.git/*' | head -n 1 || true)

          if [ -z "$settings" ]; then
            zip_file=$(find . -maxdepth 3 -type f -iname '*.zip' ! -path './.git/*' | head -n 1 || true)

            if [ -z "$zip_file" ]; then
              echo 'Android project and ZIP not found.'
              exit 1
            fi

            rm -rf .vila_extract
            mkdir -p .vila_extract

            unzip -o "$zip_file" -d .vila_extract

            settings=$(find .vila_extract -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1 || true)
          fi

          if [ -z "$settings" ]; then
            echo 'settings.gradle not found.'
            exit 1
          fi

          project=$(dirname "$settings")
          project=$(realpath "$project")

          echo "PROJECT=$project" >> "$GITHUB_ENV"

          echo "Project: $project"
          ls -la "$project"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

          echo 'Android SDK 35 is ready.'

      - name: Validate project
        shell: bash
        run: |
          set -e

          test -f "$PROJECT/settings.gradle" -o -f "$PROJECT/settings.gradle.kts"
          test -d "$PROJECT/app"
          test -f "$PROJECT/build.gradle" -o -f "$PROJECT/build.gradle.kts"

          echo 'Android project structure OK.'

      - name: Check server syntax
        shell: bash
        run: |
          if [ -f "$PROJECT/server/server.js" ]; then
            node --check "$PROJECT/server/server.js"
          fi

      - name: Build debug APK
        shell: bash
        run: |
          set -e

          cd "$PROJECT"

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Copy APK
        shell: bash
        run: |
          set -e

          apk=$(find "$PROJECT/app/build/outputs/apk" \
            -type f \
            -name '*.apk' \
            | head -n 1 || true)

          if [ -z "$apk" ]; then
            echo 'APK not found.'
            exit 1
          fi

          cp "$apk" "$GITHUB_WORKSPACE/VILA-AI-V16.apk"

          ls -lh "$GITHUB_WORKSPACE/VILA-AI-V16.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: VILA-AI-V16-APK
          path: VILA-AI-V16.apk
          if-no-files-found: error
          retention-days: 30
